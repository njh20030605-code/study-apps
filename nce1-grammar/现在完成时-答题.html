/* ==========================================================================
 *          今日错题：只看今天写错的那几题，看完一键只重写这几题
 * 口径：S[key].ok===false 且 at 落在今天。语法题在前、单词题在后。
 * 重写答对 → ok 变 true，从这里消失（和错题本一致）；仍错 → 留着，明天照常回炉。
 * ========================================================================== */
let TW_MODE='look';   // look = 看批改 / redo = 只重写
function todayWrongList(){
  const t=todayStr();
  const wrong={}; let anyWord=false;
  Object.keys(S).forEach(k=>{ const s=S[k];
    if(s && s.ok===false && s.at && todayStr(s.at)===t){ wrong[k]=1; if(k.indexOf('w.')===0) anyWord=true; } });
  const byAt=(a,b)=>(S[a.key].at||0)-(S[b.key].at||0);
  const gram=ALL.filter(r=>wrong[r.key]).sort(byAt);
  const words=anyWord ? allWordItems(144).filter(r=>wrong[r.key]).sort(byAt) : [];
  return groupByDemo(gram).concat(words);
}
function goTodayWrong(mode){ TW_MODE=mode||'look'; view='TWRONG'; render(); scrollTo(0,0); }
/* 「只重写今天的错题（N）」按钮：没错题就不显示 */

  const n=todayWrongList().length; if(!n) return '';
  return '<button class="btn '+(cls||'')+' twbtn" type="button" data-tw="redo">只重写今天的错题（'+n+'）</button>';
}

/* 交完一段后就地刷新顶部状态和分段计数（不整页重渲染，免得把刚出来的批改冲掉）。
   注意要现算，不能去拷渲染时写的旧文字 —— 那样永远显示 0。 */
function refreshStrip(){
  const strip=document.querySelector('.tstrip'); if(!strip) return;
  const count=slotId=>{
    const qs=document.querySelectorAll('#'+slotId+' .q');
    let done=0; qs.forEach(q=>{ if(q.querySelector('.fb.show')) done++; });
    return [done, qs.length];
  };
  const sl=storyLessonFor(curLesson());
  const rows=[
    ['stepText', Math.min(readsToday(sl),READ_GOAL), READ_GOAL, ' 遍'],
    ['stepWord', ...count('wordSlot'), ' 题'],
    ['stepGram', ...count('gramSlot'), ' 题']
  ];
  rows.forEach((r,i)=>{
    const btn=strip.children[i];
    if(btn){
      btn.querySelector('.tsnum').textContent=r[1]+'/'+r[2]+r[3];
      btn.classList.toggle('ok', r[2]>0 && r[1]>=r[2]);
      btn.querySelector('.tsdot').textContent=(r[2]>0 && r[1]>=r[2])?'✓':'';
    }
    const sec=document.getElementById(r[0]);
    const stat=sec&&sec.querySelector('.stepstat');
    if(stat){ stat.textContent=r[1]+'/'+r[2]+r[3]; stat.classList.toggle('ok', r[2]>0 && r[1]>=r[2]); }
  });
}

/* ==========================================================================
 *                          数据统计（纯本地，不联网）
 * ========================================================================== */
function statsData(){
  const done=ALL.filter(r=>S[r.key]);
  const ok=done.filter(r=>S[r.key].ok);

  // 按单元
  const byUnit=UNITS.map(u=>{
    const items=ALL.filter(r=>r.unit.id===u.id);
    const d=items.filter(r=>S[r.key]);
    const o=d.filter(r=>S[r.key].ok);
    return {name:u.tab, total:items.length, done:d.length, ok:o.length};
  });

  // 按语法点
  const tagMap={};
  done.forEach(r=>{
    const t=S[r.key].tag||tagOf(r);
    tagMap[t]=tagMap[t]||{name:t,done:0,ok:0};
    tagMap[t].done++; if(S[r.key].ok) tagMap[t].ok++;
  });
  const byTag=Object.values(tagMap).sort((a,b)=>(a.ok/a.done)-(b.ok/b.done));

  // 按错误类型 —— 这就是"常出错点"
  const errMap={};
  done.filter(r=>!S[r.key].ok).forEach(r=>{
    const e=S[r.key].err||'other';
    errMap[e]=(errMap[e]||0)+1;
  });
  const byErr=Object.keys(errMap).map(k=>({code:k,name:ERR_NAMES[k]||k,n:errMap[k]}))
    .sort((a,b)=>b.n-a.n);

  // 按天
  const dayMap={};
  done.forEach(r=>{
    const at=S[r.key].at; if(!at) return;
    const d=todayStr(at);
    dayMap[d]=dayMap[d]||{day:d,done:0,ok:0};
    dayMap[d].done++; if(S[r.key].ok) dayMap[d].ok++;
  });
  const byDay=Object.values(dayMap).sort((a,b)=>a.day<b.day?1:-1);

  // 连续天数
  let streak=0;
  if(byDay.length){
    const days=new Set(byDay.map(d=>d.day));
    let cur=new Date();
    if(!days.has(todayStr(cur))) cur.setDate(cur.getDate()-1);  // 今天还没做，从昨天算
    while(days.has(todayStr(cur))){ streak++; cur.setDate(cur.getDate()-1); }
  }
  return {total:TOTAL, done:done.length, ok:ok.length, byUnit, byTag, byErr, byDay, streak,
          todayDone:(dayMap[todayStr()]||{done:0}).done};
}

/* ==========================================================================
 *                    AI 诊断 + 按薄弱点出题（接 Claude API）
 * 走浏览器直连：Anthropic 原生 /v1/messages（x-api-key + 直连浏览器头），
 * 或第三方中转的 OpenAI 兼容格式。Key 只存在你本机 localStorage，只发给你填的地址。
 * ========================================================================== */
const AI_KEY='nce1-pp-ai-v1';
const AIQ_KEY='nce1-pp-aiq-v1';
function loadAI(){
  try{ return Object.assign({apiKey:'',apiBase:'https://api.anthropic.com',apiFormat:'anthropic',model:'claude-opus-5'},
       JSON.parse(localStorage.getItem(AI_KEY)||'{}')); }
  catch(e){ return {apiKey:'',apiBase:'https://api.anthropic.com',apiFormat:'anthropic',model:'claude-opus-5'}; }
}
function saveAI(cfg){ try{localStorage.setItem(AI_KEY,JSON.stringify(cfg))}catch(e){} }
function loadAIQ(){ try{ return JSON.parse(localStorage.getItem(AIQ_KEY)||'[]'); }catch(e){ return []; } }
function saveAIQ(list){ try{localStorage.setItem(AIQ_KEY,JSON.stringify(list))}catch(e){} }

/* 调 Claude。schema 传了就用 structured outputs，保证回来的是能 JSON.parse 的对象 */
async function callClaude(system, userText, schema, maxTokens){
  const cfg=loadAI();
  if(!cfg.apiKey.trim()) throw new Error('还没填 API Key —— 在上面的「AI 设置」里填一个。');
  if(!navigator.onLine) throw new Error('当前没联网，AI 功能用不了；本地统计不受影响。');

  const base=(cfg.apiBase||'https://api.anthropic.com').trim().replace(/\/+$/,'').replace(/\/v1$/,'');
  const isOpenAI = cfg.apiFormat==='openai';
  const url = base + (isOpenAI ? '/v1/chat/completions' : '/v1/messages');

  let headers;
  if(isOpenAI){
    headers={'content-type':'application/json','authorization':'Bearer '+cfg.apiKey.trim()};
  } else {
    headers={'content-type':'application/json','x-api-key':cfg.apiKey.trim(),
             'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
    // 官方只认 x-api-key；第三方中转有的只认 Authorization，非官方域名就两个都带上
    if(!/api\.anthropic\.com$/i.test(base)) headers['authorization']='Bearer '+cfg.apiKey.trim();
  }

  function makeBody(withSchema){
    // openai 兼容格式没有严格的 json_schema，只能靠提示词把格式钉住（解析那边还有兜底）
    const sys = (isOpenAI && schema)
      ? system+'\n\n【输出格式要求】只输出一个 JSON 对象，不要任何解释文字，不要包 markdown 代码块。'
        +'必须严格符合这个结构：'+JSON.stringify(schema)
      : system;
    const b = isOpenAI
      ? {model:cfg.model, max_tokens:maxTokens||8000,
         messages:[{role:'system',content:sys},{role:'user',content:userText}]}
      : {model:cfg.model, max_tokens:maxTokens||8000, system:system,
         messages:[{role:'user',content:userText}]};
    if(schema && withSchema){
      if(isOpenAI) b.response_format={type:'json_object'};
      else b.output_config={format:{type:'json_schema',schema:schema}};
    }
    return b;
  }

  async function send(body){
    const ctl=new AbortController();
    const timer=setTimeout(()=>ctl.abort(),120000);
    let resp;
    try{
      resp=await fetch(url,{method:'POST',headers:headers,body:JSON.stringify(body),signal:ctl.signal});
    }catch(e){
      clearTimeout(timer);
      throw new Error(e.name==='AbortError'?'请求超时（120 秒）。':'网络请求失败：'+e.message
        +'（如果是中转站，检查接口地址是不是只填了域名根）');
    }
    clearTimeout(timer);
    const raw=await resp.text();
    return {ok:resp.ok, status:resp.status, raw:raw};
  }

  let r=await send(makeBody(true));

  // 有些第三方中转不支持结构化输出参数，去掉重试一次（提示词里本来也要求输出 JSON，解析有兜底）
  if(!r.ok && schema && r.status>=400 && r.status<500 &&
     /output_config|json_schema|response_format|unsupported|unrecognized|unexpected|invalid_request|extra input/i.test(r.raw)){
    r=await send(makeBody(false));
  }

  if(!r.ok){
    let detail='';
    try{ const j=JSON.parse(r.raw); detail=(j.error&&(j.error.message||j.error.type))||r.raw.slice(0,200); }
    catch(e){ detail=r.raw.slice(0,200); }
    if(r.status===401) throw new Error('API Key 不对或没权限（401）：'+detail);
    if(r.status===404) throw new Error('接口地址不对（404）—— 只填域名根（例：https://api.b.ai），别带 /v1 或别的路径。'+detail);
    if(r.status===429) throw new Error('请求太频繁 / 额度不够（429）：'+detail);
    throw new Error('接口报错 '+r.status+'：'+detail);
  }

  let data;
  try{ data=JSON.parse(r.raw); }
  catch(e){ throw new Error('接口返回的不是 JSON（可能地址指到了网页而不是 API）：'+r.raw.slice(0,150)); }

  let text='';
  if(isOpenAI){
    text=((data.choices||[])[0]||{}).message?.content||'';
  } else {
    if(data.stop_reason==='refusal') throw new Error('模型拒绝了这次请求。');
    text=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
  }
  if(!text.trim()) throw new Error('模型没返回内容。');
  if(!schema) return text;
  try{ return JSON.parse(text); }
  catch(e){
    const m=text.match(/\{[\s\S]*\}/);          // 中转有时会包一层 ```
    if(m){ try{ return JSON.parse(m[0]); }catch(e2){} }
    throw new Error('模型返回的不是合法 JSON，没法用。');
  }
}

/* 把错题整理成喂给 AI 的材料 */
function mistakeDigest(){
  const rows=[];
  ALL.forEach(r=>{
    const s=S[r.key]; if(!s||s.ok) return;
    rows.push({
      语法点:s.tag||tagOf(r),
      单元:r.unit.title,
      题目:r.item.stem+(r.item.task?('（要求：'+r.item.task+'）'):''),
      我的答案:s.given,
      正确答案:ansList(r.item)[0],
      错误类型:ERR_NAMES[s.err||'other']||'其它'
    });
  });
  return rows;
}

        tip='这家不认这个模型名。点上面「拉取可用模型」看它到底支持哪些，选一个再测。';
      else if(/网络请求失败|Failed to fetch/i.test(e.message))
        tip='域名拼错，或者这家不允许浏览器直连。如果你用的是 B.AI 这类中转，把「接口格式」换成 <b>openai 兼容</b> 再测一次'
            +'——它们的 CORS 一般不放行 anthropic-version 请求头，走不了 anthropic 原生格式。';
      box.innerHTML='<div class="fb show bad">❌ 没通：'+e.message+(tip?'<div class="exp"><b>怎么办：</b>'+tip+'</div>':'')+'</div>';
    }
    this.disabled=false;
  };

  const out=document.getElementById('aiOut');
  function busy(msg){ out.innerHTML='<div class="fb show" style="display:block;background:var(--accent-soft);border:1px solid var(--accent);color:var(--ink)">'+msg+'</div>'; }
  function fail(e){ out.innerHTML='<div class="fb show bad">'+e.message+'</div>'; }

  const btnDiag=document.getElementById('btnDiag');
  if(btnDiag) btnDiag.onclick=async function(){
    busy('正在让 Claude 看你的错题…（可能要十几秒）');
    try{
      const r=await callClaude(
        '你是一位带中国初学者学《新概念英语第一册》的英语老师。学生把他做错的语法题给你看，'
        + '你要判断他到底是哪几个语法概念没吃透（而不是逐题重复讲解），按优先级排序，并给出可执行的复习动作。'
        + '用中文，直白、具体，不要客套话。evidence 里要引用他的具体错误作为证据。',
        '这是我的错题记录（JSON）：\n'+JSON.stringify(mis,null,1)
        + '\n\n另外这是我按错误类型的统计：\n'+JSON.stringify(st.byErr,null,1)
        + '\n\n请给出：overall（两三句总体判断）、weak_points（薄弱点数组，每项含 point 概念名、evidence 证据、fix 具体复习动作、priority 高/中/低）、next_focus（下一步最该练什么，一句话）。',
        DIAG_SCHEMA, 4000);
      let html='<div class="report"><div class="rtop">'+r.overall+'</div>';
      (r.weak_points||[]).forEach(w=>{
        html+='<div class="ritem"><div class="rhead"><span class="prio p'+(w.priority==='高'?'hi':(w.priority==='中'?'mid':'lo'))+'">'+w.priority+'</span>'
          + '<b>'+w.point+'</b></div>'
          + '<div class="rline"><span>证据</span>'+w.evidence+'</div>'
          + '<div class="rline"><span>怎么补</span>'+w.fix+'</div></div>';
      });
      html+='<div class="rnext"><b>下一步：</b>'+r.next_focus+'</div></div>';
      out.innerHTML=html;
    }catch(e){ fail(e); }
  };

  const btnGen=document.getElementById('btnGen');
  if(btnGen) btnGen.onclick=async function(){
    busy('正在按你的薄弱点出新题…');
    try{
      const r=await callClaude(
        '你是《新概念英语第一册》的英语老师，为中国初学者出语法练习题。要求：'
        + '① 只用新概念第一册难度的词汇和句型，句子短、日常；'
        + '② 题型只有两种：type="fill"（填空，stem 里用 ___ 标出空，hint 写括号提示如动词原形，opts 传空数组）'
        + '和 type="mc"（选择，stem 里用 ___ 标出空，opts 给 2-3 个选项，hint 传空字符串）；'
        + '③ ans 是可接受答案数组，fill 题只填空格里该填的内容，不要整句；mc 题 ans 只有一个且必须和 opts 里某项完全一致；'
        + '④ zh 是中文翻译，exp 是为什么这么填的讲解（中文，讲清规则，不要只说"因为是完成时"）；'
        + '⑤ tag 是这题考的语法点名字，用中文；'
        + '⑥ 专门针对我下面给的薄弱点出题，别出我已经会的。',
        '我的薄弱点（按出错次数）：\n'+JSON.stringify(st.byErr,null,1)
        + '\n\n我具体错过的题：\n'+JSON.stringify(mis.slice(0,20),null,1)
        + '\n\n请出 8 道新题，放在 questions 数组里。',
        GEN_SCHEMA, 8000);
      const qs=(r.questions||[]).filter(q=>q.stem&&q.ans&&q.ans.length);
      if(!qs.length) throw new Error('模型没出出有效的题。');
      const list=loadAIQ().concat(qs);
      saveAIQ(list);
      out.innerHTML='<div class="fb show good">生成了 '+qs.length+' 道新题，已存到「AI 补练题」里。</div>';
      setTimeout(()=>{renderDiag()},900);
    }catch(e){ fail(e); }
  };

  const btnDo=document.getElementById('btnDoAIQ');
  if(btnDo) btnDo.onclick=()=>{ view='AIQ'; render(); scrollTo(0,0); };
  const btnClear=document.getElementById('btnClearAIQ');
  if(btnClear) btnClear.onclick=()=>{
    if(confirm('清空所有 AI 生成的题？（本地做题记录里它们的成绩也会一起清掉）')){
      const list=loadAIQ();
      list.forEach((q,i)=>{ delete S['ai.'+i]; });
      saveAIQ([]); save(); renderDiag();
    }
  };
}

/* AI 补练题：复用同一套卡片 + 批量提交 */
function renderAIQ(){
  const list=loadAIQ();
  if(!list.length){
    main.innerHTML='<div class="empty"><b>还没有 AI 题</b>去「AI 诊断」里按薄弱点生成。</div>';
    return;
  }
  main.insertAdjacentHTML('beforeend',
    '<div class="exhead"><b>AI 补练题</b><span>共 '+list.length+' 题 · 填完一起交</span></div>');
  const cards=list.map((q,i)=>{
    const rec={key:'ai.'+i, unit:{id:'ai',title:'AI 补练'}, ex:{type:q.type==='mc'?'mc':'fill'}, item:q, no:i+1};
    const card=itemCard(rec,i);
    main.appendChild(card.el);
    return card;
  });
  attachSubmitBar(main, cards, '提交 AI 补练题');
}

function render(){
  renderTabs();
  main.innerHTML='';
  DEMO_SEEN.clear();
  if(view==='TODAY'){ setCrumb('今日作业','第 '+curLesson()+' 课 · 一天 '+DAILY_N+' 题'); renderDaily(); updateBars(); return; }
  if(view==='TWRONG'){ setCrumb('今日错题', TW_MODE==='redo'?'只重写今天写错的':'今天写错的题 · 看错在哪'); renderTodayWrong(); updateBars(); return; }
  if(view==='WORDS'){ const wl=WORD_VIEW||storyLessonFor(curLesson());
    setCrumb('单词','Lesson '+wl+' · '+(WORDS[wl]||[]).length+' 词'); renderWords(); updateBars(); return; }
  if(view==='WQUIZ' && WQUIZ){ setCrumb('单词自测', WQUIZ.les==='irreg'?'不规则动词三态':('Lesson '+WQUIZ.les));
    renderWordQuiz(); updateBars(); return; }
  if(view==='MAP'){ setCrumb('语法汇总','L83–100 · 标了哪些必掌握'); renderMap(); updateBars(); return; }
  if(view==='EXAM'){ setCrumb('阶段测评','覆盖到第 '+curLesson()+' 课的全部知识点'); renderExam(); updateBars(); return; }
  if(view==='TEXT'){ const sl=STORY_VIEW||storyLessonFor(curLesson());
    setCrumb('课文熟读','Lesson '+sl+'–'+(sl+1)); renderText(); updateBars(); return; }
  if(view==='STATS'){ setCrumb('数据统计','你的正确率、常出错点、每天记录'); renderStats(); updateBars(); return; }
  if(view==='DIAG'){ setCrumb('AI 诊断','把错题给 Claude，让它指出该复习什么'); renderDiag(); updateBars(); return; }
  if(view==='AIQ'){ setCrumb('AI 补练题','针对你的薄弱点生成'); renderAIQ(); updateBars(); return; }
  if(view==='WRONG'){
    setCrumb('错题本','答对就从错题里消失');
    const w=wrongList();
    if(!w.length){
      main.innerHTML='<div class="empty"><b>没有错题</b>全对，或者还没开始做。</div>';
      updateBars(); return;
    }
    main.insertAdjacentHTML('beforeend',
      '<div class="exhead"><b>错题重做</b><span>共 '+w.length+' 题 · 填完一起交，答对就从错题里消失；多行题只重写上次写错的行</span></div>');
    const cards=w.map((rec,i)=>{
      // fresh：空白可答，但不删存档（以前先 delete，中途放弃就把记录弄丢了）
      const card=itemCard({...rec, no:i+1}, i, {fresh:true, keepRight:true});
      main.appendChild(card.el);
      return card;
    });
    attachSubmitBar(main, cards, '提交错题重做');
    updateBars(); return;
  }

  const u=UNITS.find(x=>x.id===view);
  setCrumb(u.title.replace(/^单元 \d+ · /,''), u.lesson||'');
  main.insertAdjacentHTML('beforeend',
    '<div class="unithead">'+impChip(u.id)
    + '<span class="uwhy">'+(IMPORTANCE[u.id]?IMPORTANCE[u.id].why:'')+'</span></div>');
  main.insertAdjacentHTML('beforeend', mustPanelHTML(u.id));
  main.insertAdjacentHTML('beforeend',
    '<details class="gram" open><summary>'+u.title+' —— 语法讲解</summary><div class="gbody">'+(u.lesson?'<div class="lessontag">'+u.lesson+'</div>':'')+u.gram+'</div></details>');
  let idx=0;
  const cards=[];
  u.ex.forEach((ex,ei)=>{
    main.insertAdjacentHTML('beforeend','<div class="exhead"><b>'+ex.name+'</b><span>'+ex.inst+'</span></div>');
    ex.items.forEach((it,ii)=>{
      const rec={key:u.id+'.'+ei+'.'+ii,unit:u,ex:ex,item:it,no:ii+1};
      const card=itemCard(rec,idx++);
      main.appendChild(card.el);
      cards.push(card);
    });
  });
  bindMustPanel();
  attachSubmitBar(main, cards, '提交本单元 · 批改');

  const nav=document.createElement('div'); nav.className='acts'; nav.style.marginTop='20px';
  const i=UNITS.indexOf(u);
  if(i>0){const b=document.createElement('button');b.className='btn ghost';b.type='button';b.textContent='← '+UNITS[i-1].tab;b.onclick=()=>{view=UNITS[i-1].id;render();scrollTo(0,0)};nav.appendChild(b)}
  if(i<UNITS.length-1){const b=document.createElement('button');b.className='btn';b.type='button';b.textContent=UNITS[i+1].tab+' →';b.onclick=()=>{view=UNITS[i+1].id;render();scrollTo(0,0)};nav.appendChild(b)}
  main.appendChild(nav);
  updateBars();
}

function updateBars(){
  const done=ALL.filter(r=>S[r.key]).length;
  const ok=ALL.filter(r=>S[r.key]&&S[r.key].ok).length;
  const st=statsData();
  document.getElementById('pbar').style.width=(done/TOTAL*100)+'%';
  document.getElementById('pmeta').textContent=done+' / '+TOTAL+' 题';
  document.getElementById('pacc').textContent=done?('正确率 '+Math.round(ok/done*100)+'%'):'还没开始';
  const ms=memoStats();
  document.getElementById('pstreak').textContent='必背 '+ms.ok+'/'+ms.all+(st.streak?'　连续 '+st.streak+' 天':'');
  document.getElementById('dockstat').innerHTML=
    '今天 <b>'+st.todayDone+'</b> 题　·　对 <b>'+ok+'</b> 错 <b>'+(done-ok)+'</b> 剩 <b>'+(TOTAL-done)+'</b>';
  renderTabs();
}

document.getElementById('btnreset').onclick=()=>{
  if(confirm('清空所有答题记录，从头再做一遍？')){S={};saveLocal();view=UNITS[0].id;render();scrollTo(0,0)}
};

/* 老存档补字段：以前只存了 ok/given，没有语法点和错误类型。
   given 还在，所以可以现在反推出来，让以前做过的题也能进统计和 AI 诊断。 */
function backfill(){
  let n=0;
  ALL.forEach(r=>{
    const s=S[r.key]; if(!s) return;
    // 多行题扩了行数（四句链从 2 行变 4 行）：以前只写两行就判对的记录不再算对，
    // 直接清掉让它重新出现在作业里；判错的留着（本来就要回炉，回炉时写全四句）
    if(r.item.parts && s.ok){
      let g=null; try{ g=JSON.parse(s.given); }catch(e){}
      if(Array.isArray(g) && g.length<r.item.parts.length){ delete S[r.key]; n++; return; }
    }
    if(!s.tag){ s.tag=tagOf(r); n++; }
    if(!s.ok && !s.err){
      const d=diffHint(s.given, ansList(r.item));
      s.err=d?d.code:'other'; n++;
    }
  });
  if(n) saveLocal();
}

/* 启动：先读本地存档；本地空、但硬盘上有备份就自动恢复，然后再渲染 */
S = loadLocal();
tryAutoRestore().then(function(restored){
  if(restored && restored!==true) console.log('已从硬盘备份恢复进度（'+restored+'）');
  backfill();
  render();
});
</script>

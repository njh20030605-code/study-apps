<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>新概念英语 1 · 语法练习</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f6f4ee; --card:#fff; --card-2:#fbfaf5; --ink:#1e2230; --ink2:#5b6072; --ink3:#9a9fae;
  --line:#dedace; --accent:#2b4c7e; --accent-strong:#1b3358; --accent-soft:#e6edf7;
  --ok:#2f8f5b; --ok-bg:#e1f3e8; --bad:#c1443b; --bad-bg:#fbe7e5;
  --warn:#b96a2c; --warn-bg:#f5e6d6;
  --radius:14px;
  --shadow:0 1px 2px rgba(30,34,48,.06), 0 10px 28px -14px rgba(30,34,48,.22);
  --font-display:'Source Serif 4','Songti SC','STSong',Georgia,serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#181a21; --card:#21242d; --card-2:#262a34; --ink:#edeae1; --ink2:#a7acbb; --ink3:#6e7385;
  --line:#363b47; --accent:#8fb4e8; --accent-strong:#bbd5f5; --accent-soft:#243349;
  --ok:#6fcb98; --ok-bg:#1e3327; --bad:#e48981; --bad-bg:#3a2321;
  --warn:#e0a667; --warn-bg:#3a2e20;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px -14px rgba(0,0,0,.55);
}}
body{background:var(--bg);color:var(--ink);
  font:15px/1.7 var(--font-body);
  -webkit-font-smoothing:antialiased}
/* ===== app shell：左侧课程目录 + 右侧内容区 ===== */
.app{display:flex;min-height:100vh;align-items:stretch}
.side{flex:0 0 262px;background:var(--card);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:2px;padding:22px 16px 18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:0 4px 16px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand .bk{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600}
.brand .bt{font-family:var(--font-display);font-size:23px;font-weight:700;line-height:1.2;margin:7px 0 5px}
.brand .bl{font-size:11.5px;color:var(--ink3);line-height:1.5}

.prog{padding:0 4px 18px;border-bottom:1px solid var(--line);margin-bottom:6px}
.progtop{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:var(--ink3);margin-bottom:8px}
.progtop b{font-family:var(--font-mono);font-size:12.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .35s}
.progfoot{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:11px;
  color:var(--ink3);margin-top:8px;font-variant-numeric:tabular-nums}

.navsec{font-family:var(--font-mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink3);padding:14px 6px 8px;font-weight:600}
nav{display:flex;flex-direction:column;gap:3px}
nav button{display:flex;flex-direction:column;gap:5px;text-align:left;background:transparent;border:none;
  border-radius:10px;padding:10px 11px;font:inherit;cursor:pointer;color:var(--ink2);width:100%}
nav button:hover{background:var(--card-2);color:var(--ink)}
nav button.on{background:var(--accent-soft);color:var(--accent-strong)}
nav button .niname{font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:7px;line-height:1.35;
  flex-wrap:wrap}
nav button.on .niname{font-weight:600}
nav button .nimeta{font-family:var(--font-mono);font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav button.on .nimeta{color:var(--accent)}
nav button .nibar{display:block;height:3px;background:var(--line);border-radius:99px;overflow:hidden}
nav button .nibar i{display:block;height:100%;background:var(--accent);border-radius:99px}
nav button .nibar i.full{background:var(--ok)}
.badge{font-family:var(--font-mono);font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;
  background:var(--line);color:var(--ink2)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.sup{background:var(--warn-bg);color:var(--warn)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.sidefoot{margin-top:auto;padding-top:16px}
.sidefoot .btn{width:100%;font-size:12.5px}

.content{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:14px 26px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.crumb{font-family:var(--font-display);font-size:15.5px;font-weight:600;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb span{font-family:var(--font-mono);font-size:11px;font-weight:400;color:var(--ink3);margin-left:9px}
.todaybox{flex:0 0 auto;font-family:var(--font-mono);font-size:12px;color:var(--ink2);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.todaybox b{color:var(--ink)}
.inner{padding:4px 26px 90px;max-width:860px;width:100%}

@media (max-width:900px){
  .app{flex-direction:column}
  .side{flex:none;width:100%;height:auto;position:static;border-right:none;border-bottom:1px solid var(--line);
    padding:18px 16px 14px}
  .sidefoot{margin-top:14px}
  nav{flex-direction:row;overflow-x:auto;gap:7px;scrollbar-width:none;padding-bottom:3px}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:0 0 auto;min-width:150px;border:1px solid var(--line)}
  .topbar{padding:12px 16px}
  .inner{padding:4px 16px 80px}
}
/* 手机：正文排到导航前面 —— 打开就是今天的作业，目录划到下面找 */
@media (max-width:620px){
  .app{flex-direction:column}
  .content{order:1}
  .side{order:2;border-bottom:none;border-top:1px solid var(--line)}
  .side{padding:12px 14px 10px}
  .brand{padding:0 2px 10px;margin-bottom:10px}
  .brand .bt{font-size:18px;margin:4px 0 3px}
  .brand .bl{display:none}
  .sideprog{margin-bottom:10px}
  .sideprog .sptop{font-size:12px}
  .navsec{margin:8px 0 5px;font-size:10px}
  nav button{min-width:132px;padding:7px 11px}
  nav button .nimeta{display:none}          /* 手机上只留标题和徽标 */
  .sidefoot{margin-top:10px}
  .sidefoot .btn{padding:7px 12px;font-size:12.5px}
  /* 三件事条在手机上换成两行也不挤 */
  .tstep{flex:1 1 100%;padding:9px 12px}
  .stephead b{font-size:17px}
  .q{padding:14px 14px}
  .stem{font-size:15.5px}
}


/* grammar card */
.gram{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin:22px 0;overflow:hidden;box-shadow:var(--shadow)}
.gram>summary{padding:15px 18px;cursor:pointer;font-weight:600;font-size:15px;font-family:var(--font-display);list-style:none;
  display:flex;align-items:center;gap:8px}
.gram>summary::-webkit-details-marker{display:none}
.gram>summary::before{content:"▸";color:var(--accent);font-size:12px;transition:transform .2s;font-family:var(--font-body)}
.gram[open]>summary::before{transform:rotate(90deg)}
.gbody{padding:2px 18px 18px;border-top:1px solid var(--line);margin-top:2px}
.gbody h4{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin:18px 0 7px;font-weight:600}
.gbody p{color:var(--ink2);font-size:14px;margin:4px 0}
.gbody ul{margin:6px 0 6px 4px;padding-left:16px;color:var(--ink2);font-size:14px}
.gbody li{margin:4px 0}
.gbody code,.eg{font-family:var(--font-mono);font-size:12.5px;
  background:var(--accent-soft);color:var(--accent-strong);padding:1px 6px;border-radius:5px}
.tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px}
.tbl td,.tbl th{border:1px solid var(--line);padding:7px 10px;text-align:left}
.tbl th{background:var(--accent-soft);color:var(--accent-strong);font-weight:600;font-family:var(--font-mono);font-size:11px;letter-spacing:.03em;text-transform:uppercase}
.tbl td:first-child{font-family:var(--font-mono);font-weight:600;color:var(--accent-strong)}
.lessontag{font-family:var(--font-mono);font-size:11.5px;color:var(--warn);background:var(--warn-bg);
  display:inline-block;padding:4px 10px;border-radius:6px;margin:12px 0 2px}
.no{color:var(--bad);font-weight:600}
.yes{color:var(--ok);font-weight:600}

/* 公式块（英语兔那种把结构写成公式的讲法） */
.fml{margin:10px 0 4px;border-left:3px solid var(--accent);background:var(--accent-soft);
  border-radius:0 10px 10px 0;padding:12px 15px;display:flex;flex-direction:column;gap:9px}
.fmlrow{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
.fmlt{flex:0 0 52px;font-family:var(--font-mono);font-size:10.5px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;color:var(--accent);padding-top:2px}
.fmlrow code{font-family:var(--font-mono);font-size:13px;background:transparent;color:var(--ink);padding:0;
  line-height:1.8}
.fmlrow code b{color:var(--accent-strong);font-weight:700}
.fmlrow code em{font-style:normal;color:var(--warn);font-weight:600}
.fmlnote{font-size:12.5px;color:var(--ink2);padding-top:2px}

/* 例句拆解：每个成分一块，下面标成分名 */
.bd{margin:12px 0 6px;padding:13px 15px;background:var(--card-2);border:1px solid var(--line);border-radius:10px}
.bdrow{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.bdc{display:flex;flex-direction:column;gap:3px;align-items:center;padding:0 2px}
.bdc b{font-family:var(--font-display);font-size:16.5px;font-weight:600;line-height:1.3;
  border-bottom:2.5px solid var(--line);padding:0 4px 3px}
.bdc i{font-family:var(--font-mono);font-style:normal;font-size:10px;letter-spacing:.02em;color:var(--ink3)}
.bdc.s b{border-bottom-color:var(--accent)} .bdc.s i{color:var(--accent)}
.bdc.a b{border-bottom-color:var(--warn)}   .bdc.a i{color:var(--warn)}
.bdc.v b{border-bottom-color:var(--ok)}     .bdc.v i{color:var(--ok)}
.bdc.x b{border-bottom-color:var(--ink3)}
.bdzh{font-size:12.5px;color:var(--ink2);margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);line-height:1.7}
.bdzh b{color:var(--ink)}

/* exercise */
.exhead{margin:28px 0 12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.exhead b{font-family:var(--font-display);font-size:17px;font-weight:600;letter-spacing:.01em}
.exhead span{color:var(--ink2);font-size:13.5px}
.q{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;margin-bottom:10px;transition:border-color .2s}
.q.done-ok{border-color:var(--ok)}
.q.done-bad{border-color:var(--bad)}
.qtop{display:flex;gap:12px;align-items:flex-start}
.num{flex:0 0 23px;height:23px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  font-family:var(--font-mono);font-size:11.5px;font-weight:700;display:grid;place-items:center;margin-top:2px;font-variant-numeric:tabular-nums}
.q.done-ok .num{background:var(--ok-bg);color:var(--ok)}
.q.done-bad .num{background:var(--bad-bg);color:var(--bad)}
.qbody{flex:1;min-width:0}
.stem{font-family:var(--font-display);font-size:16px;line-height:2}
.stem .blank-i{display:inline-block;min-width:130px}
.chip{display:inline-block;font-family:var(--font-mono);font-size:11.5px;background:var(--warn-bg);color:var(--warn);
  padding:1px 8px;border-radius:5px;font-weight:600;margin-left:2px;vertical-align:1px}
.zh{color:var(--ink3);font-size:13px;margin-top:5px;font-family:var(--font-body)}
.task{font-family:var(--font-mono);font-size:12px;letter-spacing:.02em;color:var(--accent);font-weight:600;
  margin-bottom:6px;background:var(--accent-soft);display:inline-block;padding:3px 9px;border-radius:6px}
input[type=text]{font:inherit;font-family:var(--font-mono);font-size:15px;background:transparent;color:var(--ink);
  border:none;border-bottom:1.5px solid var(--ink3);padding:1px 4px;width:100%;outline:none}
input[type=text]:focus{border-color:var(--accent)}
input[type=text]:disabled{color:var(--ink2);border-style:dotted}
input[type=text].is-correct{border-bottom-color:var(--ok);color:var(--ok);font-weight:600}
input[type=text].is-wrong{border-bottom-color:var(--bad);color:var(--bad)}
.fullin{margin-top:8px}
.submit-row{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin:20px 0 6px;
  padding:14px 16px;background:var(--card);border:1.5px solid var(--accent);border-radius:var(--radius);
  position:sticky;bottom:14px;box-shadow:var(--shadow);z-index:4}
.submit-counter{margin-right:auto;font-family:var(--font-mono);font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.opts button{font:inherit;font-family:var(--font-mono);font-size:13.5px;background:var(--card-2);border:1.5px solid var(--line);
  color:var(--ink);padding:7px 15px;border-radius:9px;cursor:pointer;transition:border-color .15s}
.opts button:hover:not(:disabled){border-color:var(--accent)}
.opts button:disabled{cursor:default;opacity:.55}
.opts button.picked{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong);font-weight:600}
.opts button.pick-ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:600;opacity:1}
.opts button.pick-bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);font-weight:600;opacity:1;text-decoration:line-through}
.opts button.reveal{border-color:var(--ok);color:var(--ok);opacity:1}
.acts{display:flex;gap:8px;margin-top:11px;align-items:center}
.btn{font:inherit;font-family:var(--font-body);font-size:13.5px;padding:7px 16px;border-radius:9px;cursor:pointer;
  background:var(--accent);color:#fff;border:1.5px solid var(--accent);font-weight:600}
.btn:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.ghost{background:transparent;color:var(--ink2);border-color:var(--line);font-weight:500}
.btn.ghost:hover{color:var(--ink);border-color:var(--ink3)}
.fb{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:13.5px;line-height:1.65;display:none}
.fb.show{display:block;animation:rise .18s ease}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.fb.good{background:var(--ok-bg);color:var(--ink);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-bg);color:var(--ink);border:1px solid var(--bad)}
.fb .ans{color:var(--accent-strong);font-weight:700;font-family:var(--font-mono);font-size:13.5px;background:var(--accent-soft);padding:1px 6px;border-radius:5px}
.fb .exp{color:var(--ink2);margin-top:7px;padding-top:7px;border-top:1px solid rgba(128,128,128,.2)}

nav button.auxtab{border-style:dashed}
nav button.auxtab.on{background:var(--ink);border-color:var(--ink);color:var(--bg);border-style:solid;font-weight:600}

.modelpick{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.mpick{font-family:var(--font-mono);font-size:11.5px;padding:5px 11px;border-radius:8px;cursor:pointer;
  border:1.5px solid var(--ok);background:var(--card);color:var(--ok)}
.mpick:hover{background:var(--ok-bg)}

/* 一题多写（原书 QUESTION + NEGATIVE 那种） */
.multiwrap{margin-top:10px;display:flex;flex-direction:column;gap:9px}
.mrow{display:flex;align-items:center;gap:10px}
.mlab{flex:0 0 106px;font-family:var(--font-mono);font-size:11px;color:var(--accent);
  background:var(--accent-soft);padding:5px 8px;border-radius:6px;text-align:center}
.mkeep{flex:0 0 auto;font-size:11px;color:var(--ok);white-space:nowrap;opacity:.85}
@media (max-width:560px){.mrow{flex-wrap:wrap}.mlab{flex-basis:100%;text-align:left}}
/* 例句（照着写的示范） */
.demo{margin-top:10px;padding:9px 12px 7px;border-radius:9px;background:var(--card-2);border:1px dashed var(--line)}
.demo-h{font-family:var(--font-mono);font-size:11.5px;color:var(--ink3);margin-bottom:6px}
.demo-h span{color:var(--ink2)}
.demo-r{display:flex;align-items:baseline;gap:9px;padding:2px 0;flex-wrap:wrap}
.demo-r code{font-family:var(--font-mono);font-size:13px;color:var(--ink)}
.demo-r i{font-style:normal;font-size:11.5px;color:var(--ink3)}
.fb .eg{margin-top:4px;font-size:12.5px;color:var(--ink3)}
.fb .eg code{font-family:var(--font-mono);color:var(--ink2)}

/* 单词 */
.wlist{padding:2px 0}
.wrow{display:flex;align-items:flex-start;gap:11px;padding:13px 0;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:none}
.wrow.done{opacity:.5}
.wrow.done .wen{text-decoration:line-through;text-decoration-color:var(--ok)}
.wmain{flex:1;min-width:0}
.wtop{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.wen{font-family:var(--font-display);font-size:19px;font-weight:700}
.wph{font-family:var(--font-mono);font-size:11.5px;color:var(--ink3)}
.wpos{font-family:var(--font-mono);font-size:10.5px;color:var(--accent);background:var(--accent-soft);
  padding:1px 6px;border-radius:5px}
.wcn{font-size:14px;color:var(--ink)}
.wthree{margin-top:5px;font-size:12.5px;color:var(--ink2);background:var(--warn-bg);
  border-radius:7px;padding:5px 10px;display:inline-block}
.wthree b{font-family:var(--font-mono);color:var(--warn)}
.wtnote{color:var(--ink3);margin-left:8px}
.weg{margin-top:5px;font-family:var(--font-display);font-size:14px;font-style:italic;color:var(--ink)}
.wegzh{font-style:normal;font-family:var(--font-body);font-size:12.5px;color:var(--ink3);margin-left:9px}

/* 语法汇总大图 */
.mapgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:14px;margin-top:18px}
.mapnode{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:16px 17px;
  cursor:pointer;transition:border-color .15s, transform .15s;display:flex;flex-direction:column;gap:9px}
.mapnode:hover{border-color:var(--accent);transform:translateY(-2px)}
.mapnode.lv3{border-left:5px solid var(--bad)}
.mapnode.lv2{border-left:5px solid var(--warn)}
.mapnode.lv1{border-left:5px solid var(--line);opacity:.86}
.mnhead{display:flex;align-items:center;gap:8px}
.mnles{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--ink3)}
.mnname{font-family:var(--font-display);font-size:18.5px;font-weight:700;line-height:1.25}
.mnfml{font-family:var(--font-mono);font-size:11.5px;background:var(--accent-soft);color:var(--accent-strong);
  padding:8px 10px;border-radius:8px;line-height:1.6}
.mnpts{margin:0;padding-left:17px;font-size:12.5px;color:var(--ink2);line-height:1.75}
.mnpts li{margin:2px 0}
.mnfoot{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:11px;
  color:var(--ink3);padding-top:8px;border-top:1px solid var(--line);margin-top:auto}
.mngo{margin-top:4px;font-size:12.5px;padding:8px 14px}
.tagchip{display:inline-block;font-family:var(--font-mono);font-size:11px;background:var(--card-2);
  border:1px solid var(--line);color:var(--ink2);padding:3px 9px;border-radius:99px;margin:3px 4px 3px 0}

/* 顶部：今天三件事 */

<script>
/* ============ 题库 ============ */
const UNITS = [
{
 id:'u1', tab:'构成：have/has + 过去分词', les:'L83–84', lesson:'Lesson 83–84 引入 · 88 / 90 课给不规则动词表', title:'单元 1 · have / has + 过去分词',
 gram:`
  <h4>1. 五个公式，背下来就够用</h4>
  <div class="fml">
   <div class="fmlrow"><span class="fmlt">肯定</span><code>主语 + <b>have / has</b> + <b>过去分词</b> + 其他</code></div>
   <div class="fmlrow"><span class="fmlt">否定</span><code>主语 + <b>have / has</b> + <em>not</em> + <b>过去分词</b> + 其他</code></div>
   <div class="fmlrow"><span class="fmlt">一般疑问</span><code><b>Have / Has</b> + 主语 + <b>过去分词</b> + 其他 ?</code></div>
   <div class="fmlrow"><span class="fmlt">特殊疑问</span><code>疑问词 + <b>have / has</b> + 主语 + <b>过去分词</b> ?</code></div>
   <div class="fmlrow"><span class="fmlt">简答</span><code>Yes, 主语 + have / has.　　No, 主语 + <em>haven't / hasn't</em>.</code></div>
   <div class="fmlnote">整个时态只有两个零件会变：<b>助动词</b>（have 还是 has，由主语决定）和<b>过去分词</b>（动词的第三态）。其余语序照原句。</div>
  </div>
  <table class="tbl"><tr><th>主语</th><th>助动词</th><th>例</th></tr>
   <tr><td>I / you / we / they</td><td>have</td><td>I <b>have</b> finished.</td></tr>
   <tr><td>he / she / it / 单数名词</td><td>has</td><td>Tom <b>has</b> finished.</td></tr></table>

  <h4>2. 例句拆解</h4>
  <div class="bd">
   <div class="bdrow">
    <span class="bdc s"><b>I</b><i>主语</i></span>
    <span class="bdc a"><b>have</b><i>助动词</i></span>
    <span class="bdc v"><b>finished</b><i>过去分词</i></span>
    <span class="bdc x"><b>my homework</b><i>宾语</i></span>
   </div>
   <div class="bdzh">我已经做完作业了。—— 主语 I 是第一人称，所以助动词用 <b>have</b>；finish 是规则动词，第三态直接加 -ed。重点不在"什么时候做完"，而在<b>现在作业已经完成</b>这个结果。</div>
  </div>
  <div class="bd">
   <div class="bdrow">
    <span class="bdc s"><b>Tom</b><i>主语</i></span>
    <span class="bdc a"><b>has</b><i>助动词</i></span>
    <span class="bdc a"><b>not</b><i>否定</i></span>
    <span class="bdc v"><b>lost</b><i>过去分词</i></span>
    <span class="bdc x"><b>his keys</b><i>宾语</i></span>
   </div>

  <div class="bd">

  <h4>3. 过去分词怎么来</h4>

  <li><span class="no">✗ He have gone.</span> → <span class="yes">✓ He has gone.</span>（第三人称单数用 has）</li></ul>`,

  <h4>位置公式：记"夹中间"还是"扔句末"</h4>
  <div class="fml">
   <div class="fmlrow"><span class="fmlt">夹中间</span><code>主语 + have/has + <em>just / already / ever / never</em> + <b>过去分词</b></code></div>

   <div class="fmlrow"><span class="fmlt">疑问</span><code>Have/Has + 主语 + <em>ever</em> + <b>过去分词</b> …?　／　… + <b>过去分词</b> + 其他 + <em>yet</em> ?</code></div>
   <div class="fmlnote">一句话记牢：<b>yet 永远在最后，而且只出现在否定句和疑问句里</b>；其余四个都夹在 have/has 和过去分词之间。</div>
  </div>

   <tr><td>already</td><td>已经</td><td>肯定句</td><td>have 和 p.p. <b>中间</b></td></tr>
   <tr><td>yet</td><td>还（没）</td><td><b>否定句 / 疑问句</b></td><td>放<b>句末</b></td></tr>
   <tr><td>ever</td><td>曾经</td><td>疑问句</td><td>have 和 p.p. 中间</td></tr>
   <tr><td>never</td><td>从未</td><td>肯定形式，意思是否定</td><td>have 和 p.p. 中间</td></tr></table>

  </div>
  <div class="bd">
   <div class="bdrow">

    <span class="bdc s"><b>you</b><i>主语</i></span>
    <span class="bdc v"><b>had</b><i>过去分词</i></span>
    <span class="bdc x"><b>lunch</b><i>宾语</i></span>

  </div>

 id:'u3', tab:'been to / gone to', les:'L85 + 课外', lesson:'been to = 85 课首现（书上有注释）；gone to 原书从未教过，是中文教辅的补充对比', title:'单元 3 · have been to  vs  have gone to',
 gram:`
  <h4>三个公式，对应三种意思</h4>
  <div class="fml">
   <div class="fmlrow"><span class="fmlt">去过</span><code>主语 + have/has + <b>been to</b> + 地点　<em>（经历，人已经回来了）</em></code></div>
   <div class="fmlrow"><span class="fmlt">去了</span><code>主语 + have/has + <b>gone to</b> + 地点　<em>（人还在那边，没回来）</em></code></div>
   <div class="fmlrow"><span class="fmlt">待了多久</span><code>主语 + have/has + <b>been in</b> + 地点 + <b>for</b> + 时间段</code></div>
   <div class="fmlnote">做题时先找线索问一句：<b>人现在在不在这儿？</b>在这儿（说自己的经历、说"去过几次"）→ been；不在这儿（"他不在办公室"、"下周才回来"）→ gone。</div>
  </div>
  <h4>一句话分清</h4>
  <table class="tbl"><tr><th>说法</th><th>意思</th><th>人现在在哪</th></tr>
   <tr><td>have <b>been</b> to</td><td>去过（经历）</td><td><b>已经回来了</b>，就在这儿</td></tr>
   <tr><td>have <b>gone</b> to</td><td>去了（走了）</td><td><b>还在那边</b>，不在这儿</td></tr></table>
  <h4>例句拆解</h4>
  <div class="bd">
   <div class="bdrow">
    <span class="bdc s"><b>I</b><i>主语</i></span>
    <span class="bdc a"><b>have</b><i>助动词</i></span>

  </div>
  <div class="bd">
   <div class="bdrow">

    <span class="bdc a"><b>has</b><i>助动词</i></span>
    <span class="bdc v"><b>gone to</b><i>去了·没回来</i></span>

 gram:`
  <h4>两个公式摆一起，差别一眼看到</h4>
  <div class="fml">
   <div class="fmlrow"><span class="fmlt">过去时</span><code>主语 + <b>动词过去式</b> + 其他 + <em>明确的过去时间</em>（yesterday / last week / … ago / in 2019）</code></div>

   <div class="fmlnote">判断只看一件事：<b>句子里有没有指明"过去某个时间点"</b>。有 → 一般过去时，句子到此为止；没有、只关心"到现在为止怎么样了" → 现在完成时。<br>另外 <b>When…? 开头一律用过去时</b>——因为 When 本身就是在追问那个具体时间点。</div>

   <tr><td>例</td><td>I <b>lost</b> my keys yesterday.</td><td>I <b>have lost</b> my keys.（现在还找不到）</td></tr></table>

    <span class="bdc v"><b>lost</b><i>过去式</i></span>

   <div class="bdzh">我昨天丢了钥匙。—— 有 yesterday 钉住了时间，只讲<b>过去那件事</b>；钥匙现在找到没有，这句话不管。</div>

 {
  id:'u12', tab:'have done 两个用法（剑桥）', les:'剑桥初级语法 · 对应 L83–90', lesson:'《剑桥初级英语语法》(Essential Grammar in Use) 现在完成时几个单元的总纲：同一个 have done，两种意思',
  title:'单元 12 · have done 的两个用法（剑桥初级语法）',
  gram:`
   <h4>同一个 have done，剑桥把它分成两种意思</h4>
   <div class="fml">
    <div class="fmlrow"><span class="fmlt">用法 1</span><code><b>做过了 → 看现在的结果／经历</b>　I <b>have lost</b> my key.（钥匙丢了，<em>现在</em>还没找到）</code></div>
    <div class="fmlrow"><span class="fmlt">用法 2</span><code><b>过去开始 → 现在还在继续</b>　I <b>have lived</b> here <em>for ten years</em>.（十年前搬来，<em>现在</em>还住着）</code></div>
    <div class="fmlnote">判断只问一句：<b>这个动作／状态现在还在继续吗？</b><br>
    不在继续、只剩结果或经历 → <b>用法 1</b>（常带 just / already / yet / ever / never，<b>不说具体时间</b>）；<br>
    还在继续 → <b>用法 2</b>（常带 <b>for</b> + 一段 / <b>since</b> + 起点 / <b>How long…?</b>，动词多是 be · live · work · know · have 这类"状态"）。<br>
    新概念 83–88 课学的全是用法 1，89 课的 for / since 才是用法 2 —— 剑桥把两者放在一起对照，正好补上这一课。</div>
   </div>
   <h4>用法 1：做过了，看现在（L83–88 学的都是它）</h4>
   <div class="bd">
    <div class="bdrow">
     <span class="bdc s"><b>I</b><i>主语</i></span>
     <span class="bdc a"><b>have</b><i>助动词</i></span>
     <span class="bdc v"><b>lost</b><i>过去分词</i></span>
     <span class="bdc x"><b>my key</b><i>宾语</i></span>
    </div>
    <div class="bdzh">我把钥匙丢了。—— 剑桥的解释是：I lost it and I still don't have it（丢了，<b>现在</b>还没有）。说话人关心的是"现在没钥匙"，不是"几点丢的"。一旦要说几点丢的，就换过去时：I <b>lost</b> my key <b>this morning</b>.</div>
   </div>
   <div class="bd">
    <div class="bdrow">
     <span class="bdc a"><b>Have</b><i>助动词</i></span>
     <span class="bdc s"><b>you</b><i>主语</i></span>
     <span class="bdc a"><b>ever</b><i>曾经</i></span>
     <span class="bdc v"><b>been</b><i>过去分词</i></span>
     <span class="bdc x"><b>to Japan</b><i>地点</i></span>
    </div>
    <div class="bdzh">你去过日本吗？—— 问的是"到现在为止的经历"，也是用法 1，人现在不在日本。回答同样不带时间：Yes, I have. / No, never.</div>

   <h4>用法 2：从过去一直到现在（L89 的 for / since 就是它）</h4>
   <div class="bd">
    <div class="bdrow">

     <span class="bdc a"><b>have</b><i>助动词</i></span>
     <span class="bdc v"><b>been</b><i>过去分词</i></span>
     <span class="bdc x"><b>married</b><i>状态</i></span>
     <span class="bdc a"><b>for five years</b><i>for + 一段</i></span>
    </div>
    <div class="bdzh">丹和凯特结婚五年了。—— 剑桥同款例句：They <b>are</b> married（现在是已婚）→ They <b>have been</b> married for five years（这个状态<b>持续了</b>五年，现在还是）。中文的"结婚五年<b>了</b>"就是这个意思，但英文<b>不能</b>写 They are married for five years。</div>
   </div>
   <div class="bd">
    <div class="bdrow">
     <span class="bdc a"><b>How long</b><i>问多久</i></span>
     <span class="bdc a"><b>have</b><i>助动词</i></span>
     <span class="bdc s"><b>you</b><i>主语</i></span>
     <span class="bdc v"><b>known</b><i>过去分词</i></span>
     <span class="bdc x"><b>each other</b><i>宾语</i></span>
    </div>
    <div class="bdzh">你们认识多久了？—— 用法 2 的标准提问。回答：We have known each other <b>since</b> 2010. / <b>for</b> a long time.</div>
   </div>
   <h4>两个用法并排看：动词形式一模一样，意思不一样</h4>
   <div class="fml">
    <div class="fmlrow"><span class="fmlt">用法 1</span><code>I <b>have been</b> to Paris.　去过巴黎（经历，人现在不在巴黎）</code></div>
    <div class="fmlrow"><span class="fmlt">用法 2</span><code>I <b>have been</b> in Paris <em>for a week</em>.　在巴黎待了一周了（人现在还在巴黎）</code></div>
    <div class="fmlrow"><span class="fmlt">用法 1</span><code>She <b>has worked</b> very hard.　她已经很努力了（评价到现在的结果）</code></div>
    <div class="fmlrow"><span class="fmlt">用法 2</span><code>She <b>has worked</b> here <em>since 2019</em>.　她 2019 年起就在这儿工作（现在还在）</code></div>
    <div class="fmlnote">靠<b>有没有 for / since / How long</b> 来区分：有 → 用法 2；没有 → 用法 1。</div>
   </div>
   <div class="caution">
    <span class="label">易错提醒</span>
    ① <b>中文的"了"骗人。</b>"住了十年了"是"现在还住着"，英文要用 have lived：<span class="no">✗ I live here for ten years</span>（一般现在时说不出"十年了"）、<span class="no">✗ I lived here for ten years</span>（过去时 = 现在已经搬走）都不对。<br>

    ④ 用法 2 剑桥还有一种 have been + doing（It has been raining all day）的形式，新概念第一册没教，这里先不练。
   </div>`,

    {stem:'Dan and Kate are married. They ___ married for five years.', hint:'be', ans:['have been'], zh:'丹和凯特结婚五年了。', exp:'前一句 are married 说现在的状态；后一句加了 for five years，讲这个状态持续了多久 → have been。', tag:'have done 两个用法'},
    {stem:'Sarah is a doctor. She ___ a doctor since 2018.', hint:'be', ans:['has been'], zh:'莎拉是医生，2018 年起就是了。', exp:'since 2018 → 用法 2；she → has been。', tag:'have done 两个用法'},
    {stem:'I know Tom well. I ___ him for a long time.', hint:'know', ans:['have known'], zh:'我很熟汤姆，认识他很久了。', exp:'know–knew–<b>known</b>；for a long time 是一段 → have known。', tag:'have done 两个用法'},
    {stem:'My parents live in Paris. They ___ there since 2015.', hint:'live', ans:['have lived'], zh:'我父母住在巴黎，2015 年起就住那儿了。', exp:'第一句 live 是一般现在时（现在住哪）；第二句有 since 2015，讲持续 → have lived。', tag:'have done 两个用法'},
    {stem:'We ___ this car for six months.', hint:'have', ans:['have had'], zh:'这辆车我们买了半年了。', exp:'两个 have：前面是助动词 have，后面是"拥有"的过去分词 had（have–had–had）。', tag:'have done 两个用法'},
    {stem:'I ___ Anna since Monday.', hint:'not see', ans:["haven't seen",'have not seen'], zh:'我从周一起就没见过安娜。', exp:'用法 2 的否定：从周一到现在没见过 → haven\'t seen；不能写 didn\'t see，since 不配过去时。', tag:'have done 两个用法'},
    {stem:'I ___ in London for two years, but now I live in Shanghai.', hint:'live', ans:['lived'], zh:'我在伦敦住过两年，不过现在住上海。', exp:'虽然有 for two years，但后半句说"现在住上海"→ 伦敦那段<b>已经结束</b> → 一般过去时 lived。有 for 不等于一定用完成时，关键是现在还在不在。', tag:'have done 两个用法'},

    {stem:'I have lived in Paris for two years. Now I live in London.', task:'改对第一句（第二句不用抄）', ans:['I lived in Paris for two years','I lived in Paris for two years. Now I live in London'], zh:'我在巴黎住过两年，现在住伦敦。', exp:'反过来的错：巴黎那段已经结束（现在在伦敦），不能用完成时 → lived。用法 2 的前提是"现在还在"。', tag:'have done 两个用法'},

 id:'u6', tab:'课本原型题', les:'L84–90', lesson:'照原书 Written exercises 的四种题型',

 gram:`
  <h4>这个单元练的不是新语法，是原书的四种考法</h4>
  <p>前面五个单元把语法点拆开练。但原书 84 / 86 / 88 / 90 课的课后练习是<b>另外四种出题方式</b>——
  同样的语法，换成这些格式很多人就写不出来了。这个单元就是这四种。</p>
  <table class="tbl"><tr><th>题型</th><th>出自</th><th>考你什么</th></tr>
   <tr><td>成对判别</td><td>L86 A</td><td>两句几乎一样，只有一句能加 has —— 逼你看时间状语</td></tr>
   <tr><td>一题两写</td><td>L88 / L90 A</td><td>一个陈述句，写出疑问式 + 否定式两行</td></tr>
   <tr><td>四句链</td><td>L88 B</td><td>Have…yet? → already → When did…? → …ago 一组四句</td></tr>
   <tr><td>What about…?</td><td>L90 B</td><td>用完成时否定回应"那某某呢？"</td></tr></table>
  <div class="caution"><span class="label">一个容易吵架的点</span>
  <b>this morning / today / this week</b> 这类"还没结束的时段"，完成时和过去时<b>都能用</b>，
  看你想强调什么：<span class="eg">She has emptied the basket this morning.</span>（今天上午刚倒的，还没过完这一天）
  ／<span class="eg">She emptied the basket this morning.</span>（就是上午那会儿的事）。
  真正一刀切的只有 <b>yesterday / last week / … ago / in 2019</b> —— 这些一律不能用完成时。
  所以判别题里我只用这类明确的时间状语，不拿 this morning 考你。</div>
  <div class="caution"><span class="label">怎么用</span>

  一题两写和四句链要把<b>整句</b>写出来，标点不用管，大小写也不计较。</div>`,
 ex:[
  {name:'Exercise A · 成对判别（L86 A 同款）', inst:'这句能不能加 has / have？能加就填助动词，不能加就选"用过去式"。', type:'mc', items:[

   {stem:'He ___ already painted that bookcase.', opts:['has','用过去式（不能加 has）'], ans:'has',

   {stem:'He ___ painted it a week ago.', opts:['has','用过去式（不能加 has）'], ans:'用过去式（不能加 has）',

   {stem:'She ___ emptied the basket. Look, it is empty now.', opts:['has','用过去式（不能加 has）'], ans:'has',

   {stem:'They ___ left yesterday.', opts:['have','用过去式（不能加 have）'], ans:'用过去式（不能加 have）',

  ]},
  {name:'Exercise B · 一题两写（L88 / L90 A 同款）', inst:'照原书格式，把每个句子改成疑问式和否定式，各写一整句。', type:'multi',
   demo:[
     {stem:'He has washed the car.', lines:[

     {stem:'He washed the car yesterday.', lines:[

   ], items:[
   {stem:'He found his pen a minute ago.', task:'写出疑问式 + 否定式',
    parts:[{label:'QUESTION', ans:['Did he find his pen a minute ago','did he find his pen a minute ago'], ph:'Did he …?'},

  {name:'Exercise C · 四句链（L88 B 同款）', inst:'照原书格式，同一件事写四句：完成时问"做了没"→ 简答 Yes →过去时问"什么时候"→ 过去时 + 时间点回答。斜杠后面那个时间（… ago）只在<b>最后一句回答</b>里出现——前面三句都不带时间，完成时问句里更不能塞 ago。', type:'multi',
   demo:[{stem:'they / wash the car / an hour ago', lines:[

{
 id:'u7', tab:'将来时：will', les:'L91–92', lesson:'Lesson 92 When will…?',
 title:'单元 7 · 一般将来时 will',
 gram:`
  <h4>公式：不管主语是谁，一律 will + 动词原形</h4>
  <div class="fml">
   <div class="fmlrow"><span class="fmlt">肯定</span><code>主语 + <b>will</b> + 动词原形　（口语几乎都缩写成 <b>'ll</b>）</code></div>
   <div class="fmlrow"><span class="fmlt">否定</span><code>主语 + <b>will not</b> + 动词原形　（缩写 <b>won't</b>）</code></div>
   <div class="fmlrow"><span class="fmlt">疑问</span><code><b>Will</b> + 主语 + 动词原形 …?　／　<b>When will</b> + 主语 + 动词原形 …?</code></div>
   <div class="fmlnote">和现在完成时最大的不同：<b>will 后面永远是动词原形</b>，不是过去分词。
   <span class="no">✗ He will gone.</span> → <span class="yes">✓ He will go.</span><br>
   而且 will 不随主语变：I will / he will / they will 全一样，没有 wills 这种东西。</div>
  </div>
  <h4>例句拆解</h4>
  <div class="bd">
   <div class="bdrow">
    <span class="bdc a"><b>When will</b><i>什么时候</i></span>
    <span class="bdc s"><b>he</b><i>主语</i></span>
    <span class="bdc v"><b>move</b><i>动词原形</i></span>
    <span class="bdc x"><b>?</b><i></i></span>
   </div>
   <div class="bdzh">他什么时候搬？—— 注意 move 是<b>原形</b>，不能写 moves 也不能写 moved。</div>
  </div>
  <div class="bd">
   <div class="bdrow">
    <span class="bdc s"><b>He</b><i>主语</i></span>
    <span class="bdc a"><b>will</b><i>助动词</i></span>
    <span class="bdc v"><b>move</b><i>原形</i></span>
    <span class="bdc x"><b>the day after tomorrow</b><i>将来时间</i></span>
   </div>
   <div class="bdzh">他后天搬。缩写就是 <b>He'll move…</b>——原书 92 课的练习就是专门练这个缩写。</div>
  </div>
  <h4>92 课那张时间表（背下来就够用）</h4>
  <table class="tbl"><tr><th>今天</th><th>明天</th><th>后天</th></tr>
   <tr><td>this morning</td><td>tomorrow morning</td><td>the day after tomorrow in the morning</td></tr>
   <tr><td>this afternoon</td><td>tomorrow afternoon</td><td>the day after tomorrow in the afternoon</td></tr>
   <tr><td>this evening</td><td>tomorrow evening</td><td>the day after tomorrow in the evening</td></tr>
   <tr><td>tonight</td><td>tomorrow night</td><td>the night after next</td></tr></table>
  <div class="caution"><span class="label">易错提醒</span>
  <b>yesterday / last week / … ago</b> 这些过去时间和 will 不能同时出现（<span class="no">✗ He will arrive yesterday.</span>）；
  同样 <b>tomorrow / next week</b> 也不能配过去时或完成时（<span class="no">✗ He has arrived tomorrow.</span>）。
  看到时间状语先判断是过去、现在还是将来，再决定用哪个时态。</div>`,

{
 id:'u10', tab:'物主代词 mine/yours', les:'L97–98', lesson:'Lesson 98 名词性物主代词与 belong to',
 title:'单元 10 · mine / yours / hers 与 belong to',
 gram:`
  <h4>两种物主形式，差别是后面有没有名词</h4>
  <table class="tbl"><tr><th>人</th><th>形容词性（后面要跟名词）</th><th>名词性（后面<b>不</b>跟名词）</th></tr>
   <tr><td>I</td><td>my case</td><td><b>mine</b></td></tr>
   <tr><td>you</td><td>your case</td><td><b>yours</b></td></tr>
   <tr><td>he</td><td>his case</td><td><b>his</b>（同形）</td></tr>
   <tr><td>she</td><td>her case</td><td><b>hers</b></td></tr>
   <tr><td>we</td><td>our case</td><td><b>ours</b></td></tr>
   <tr><td>they</td><td>their case</td><td><b>theirs</b></td></tr></table>
  <div class="fml">
   <div class="fmlrow"><span class="fmlt">互换</span><code>It <b>belongs to</b> me. ＝ It is <b>mine</b>.</code></div>
   <div class="fmlrow"><span class="fmlt">提问</span><code>Is this case <b>yours</b>? — Yes, it's <b>mine</b>. It <b>belongs to</b> me.</code></div>
   <div class="fmlnote">belong <b>to</b> 后面跟"人"（me / him / my sister）；名词性物主代词后面<b>什么都不跟</b>。
   <span class="no">✗ It is mine case.</span> → <span class="yes">✓ It is my case.</span> 或 <span class="yes">✓ It is mine.</span></div>
  </div>
  <h4>例句拆解</h4>
  <div class="bd">
   <div class="bdrow">
    <span class="bdc s"><b>This dress</b><i>东西</i></span>
    <span class="bdc v"><b>belongs to</b><i>属于</i></span>
    <span class="bdc a"><b>my sister</b><i>人</i></span>
   </div>
   <div class="bdzh">这条裙子是我姐姐的。换成名词性物主代词：<span class="eg">It is hers.</span>（原书 98 课 A 就是这个改写）</div>
  </div>
  <div class="bd">
   <div class="bdrow">
    <span class="bdc a"><b>Are these</b></span><span class="bdc s"><b>your keys</b><i>形容词性 + 名词</i></span>
   </div>
   <div class="bdzh">这些是你的钥匙吗？回答两句：<span class="eg">Yes, they're mine.</span>（名词性）<span class="eg">They belong to me.</span>（belong to + 人）</div>
  </div>
  <div class="caution"><span class="label">易错提醒</span>
  <b>belongs</b> 要跟主语一致：单数东西用 belongs（This case belongs to me），复数用 belong（These books belong to me）。<br>
  <b>his 两种形式一样</b>，别因此以为其他词也不变：her → hers、their → theirs 都要加 s。

/* ==========================================================================
 *              本地存档 + 自动备份到硬盘（防浏览器清数据）
 * 双击「启动学习.command」跑本地服务器后，每次「提交」都会把 S 额外 POST
 * 给服务器写成 backups/latest.json，进度就落在硬盘上了。
 * 如果是直接双击 html（file:// 打开，没有服务器），fetch 会失败、静默忽略，
 * 功能照常，只是没有硬盘备份——所以推荐用 .command 启动。
 * ========================================================================== */
const HAS_SERVER = location.protocol==='http:' || location.protocol==='https:';
let _lastBackupJSON='';

function loadLocal(){ try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}} }
function saveLocal(){ try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} }
function hasProgress(){ return Object.keys(S).length>0; }

function pushBackup(){
  if(!HAS_SERVER || !hasProgress()) return;
  try{
    const body=JSON.stringify(S);
    if(body===_lastBackupJSON) return;
    fetch('/api/backup',{method:'POST',headers:{'Content-Type':'application/json'},body})
      .then(r=>{ if(r.ok) _lastBackupJSON=body; })
      .catch(()=>{});
  }catch(e){}
}
function save(){ saveLocal(); pushBackup(); }

function tryAutoRestore(){
  if(!HAS_SERVER) return Promise.resolve(false);
  if(Object.keys(loadLocal()).length>0) return Promise.resolve(false); // 本地已有数据，不覆盖
  return fetch('/api/backup/latest')
    .then(r=>r.ok?r.json():null)
    .then(j=>{
      if(!j||!j.ok||!j.state||!Object.keys(j.state).length) return false;
      S=j.state; saveLocal();
      return j.savedAt||true;
    })
    .catch(()=>false);
}
window.addEventListener('beforeunload',function(){
  if(!HAS_SERVER || !hasProgress()) return;
  try{
    const body=JSON.stringify(S);
    if(body!==_lastBackupJSON) fetch('/api/backup',{method:'POST',headers:{'Content-Type':'application/json'},body,keepalive:true});
  }catch(e){}
});

/* ============ 判分 ============ */
function norm(s){
  return (s||'').toLowerCase()
    .replace(/[‘’]/g,"'").replace(/[“”]/g,'"')
    .replace(/[.,!?;:"？！，。；：、（）]/g,' ')   // 换成空格：Mrs.Jones → mrs jones，Yes,she → yes she（原来直接删掉会粘成一个词，判错）
                                             // 全角「？。，」也算：中文输入法下打出的问号是 U+FF1F，原来没认出来，pen？ 被当成一个词判错
    .replace(/\bi'?ve\b/g,'i have').replace(/\byou'?ve\b/g,'you have')
    .replace(/\bwe'?ve\b/g,'we have').replace(/\bthey'?ve\b/g,'they have')
    .replace(/\bhe's\b/g,'he has').replace(/\bshe's\b/g,'she has').replace(/\bit's\b/g,'it has')
    .replace(/\bhasn'?t\b/g,'has not').replace(/\bhaven'?t\b/g,'have not')
    .replace(/\bdidn'?t\b/g,'did not').replace(/\bneedn'?t\b/g,'need not')
    .replace(/\s+/g,' ').trim();
}
function ansList(it){ return Array.isArray(it.ans) ? it.ans : [it.ans]; }
/* 多行题的标准答案存的时候没带句末标点（判分本来就忽略标点），显示给人看时补上：
   标签是问句（Have…yet? / When did…?）或句子以疑问词/助动词开头就加 ?，否则加 . */
function endPunct(a, label){
  a=String(a||'').trim();
  if(!a||/[.?!]$/.test(a)) return a;
  const q=/\?/.test(label||'') || /^(have|has|had|did|do|does|when|where|what|who|why|how|is|are|was|were|can|will)\b/i.test(a);
  return a+(q?'?':'.');
}
function gradeAnswer(it,given){
  // multi 题（一题多行）：每一行都对才算这道题对
  if(it.parts){
    let g=[]; try{ g=JSON.parse(given); }catch(e){ return false; }
    if(!g.length) return false;
    return it.parts.every((pt,i)=>{
      const v=norm(g[i]||''); if(!v) return false;
      return (pt.ans||[]).some(a=>norm(a)===v);
    });
  }
  const g=norm(given);
  if(!g) return false;
  return ansList(it).some(a=>norm(a)===g);
}

/* ==========================================================================
 *        逐词诊断 —— 具体指出错在哪个词，而不是每题固定显示同一句话
 * 背景：之前不管你写错哪里，永远显示同一条 exp（比如写错了 has/have，
 * 却显示的是 write 的过去分词拼写规则）。这里先把你写的和标准答案逐词对比，
 * 定位到底是哪个词、以及是哪一类典型混淆，再补上原来那条通用语法点。
 * ========================================================================== */
const IRREGULAR = {   // base: [过去式, 过去分词]
  write:['wrote','written'], eat:['ate','eaten'], buy:['bought','bought'],
  lose:['lost','lost'], make:['made','made'], break:['broke','broken'],
  see:['saw','seen'], go:['went','gone'], find:['found','found'],
  read:['read','read'], swim:['swam','swum'], have:['had','had'],
  wash:['washed','washed'], paint:['painted','painted'], finish:['finished','finished'],
  arrive:['arrived','arrived']
};
/* 错误类型：code 用来做统计和 AI 诊断，name 是给人看的名字 */
const ERR_NAMES = {
  'aux-agreement':'助动词主谓一致（have / has）',
  'been-gone':'been to / gone to 分不清',
  'tense-aux':'完成时和过去时的助动词混用（did / have）',
  'verb-base':'动词用了原形，没变形',
  'verb-past-vs-pp':'用了过去式，该用过去分词',
  'missing-not':'否定句漏了 not',
  'missing-word':'漏词',
  'word-wrong':'用词/词形不对',
  'time-in-perfect':'完成时里塞了具体过去时间',
  'did-plus-past':'did 后面跟了过去式，没回原形',
  'short-answer':'简答多写了东西',
  'unanswered':'没作答',
  'other':'其它'
};
const SWAP_RULES = [
  {a:'have',b:'has', code:'aux-agreement', msg:'have / has 由主语决定：第三人称单数（he / she / it / 单数名词）用 has，其余（I / you / we / they / 复数）用 have。'},
  {a:"haven't",b:"hasn't", code:'aux-agreement', msg:"haven't / hasn't 由主语决定：第三人称单数用 hasn't，其余用 haven't。"},
  {a:'gone',b:'been', code:'been-gone', msg:'gone to 表示"去了、人还没回来"；been to 表示"去过、人已经回来了"——看句子里说话人／主语现在在不在场。'},
  {a:'did',b:'have', code:'tense-aux', msg:'did 是一般过去时的助动词；句子如果强调"到现在为止"的结果或经历，要用现在完成时的 have，不是 did。'},
  {a:'did',b:'has', code:'tense-aux', msg:'did 是一般过去时的助动词；句子如果强调"到现在为止"的结果或经历，要用现在完成时的 has，不是 did。'},
];
function swapRule(a,b){
  return SWAP_RULES.find(r=>(r.a===a&&r.b===b)||(r.a===b&&r.b===a))||null;
}
function verbFormRule(given,correct){
  for(const base in IRREGULAR){
    const past=IRREGULAR[base][0], pp=IRREGULAR[base][1];
    if(given===past && correct===pp && past!==pp)
      return {code:'verb-past-vs-pp', msg:base+' 是不规则动词：一般过去式是 '+past+'，过去分词是 '+pp+'——这里要用过去分词。'};
    if(given===base && (correct===past||correct===pp))
      return {code:'verb-base', msg:base+' 不能用原形，要变成 '+correct+'。'};
    // did / didn't 后面跟了过去式（Did he found…）——这是四句链第三句最常踩的坑
    if(correct===base && (given===past||given===pp))
      return {code:'did-plus-past', msg:'did / didn\'t 后面永远跟原形：写 '+base+'，不能写 '+given+'。过去的意思已经由 did 表达过一次了。'};
  }
  // 规则动词的同一个坑（washed → wash）
  if(given===correct+'ed'||given===correct+'d')
    return {code:'did-plus-past', msg:'did / didn\'t 后面永远跟原形：写 '+correct+'，不能写 '+given+'。'};
  return null;
}
/* 词级对齐（LCS）：算出你比标准答案「多写了哪些词」「少写了哪些词」。
   原来只会按词数差 0 / ±1 硬对齐，遇到多写一整段（… two weeks ago）就直接放弃，
   或者拿错了对照答案，报出 "你写的是 mrsjones，这里应该是 her" 这种莫名其妙的话。 */
function alignOps(g,t){
  const n=g.length,m=t.length,dp=[];
  for(let i=0;i<=n;i++) dp.push(new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--)
    dp[i][j] = g[i]===t[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j],dp[i][j+1]);
  const ops=[]; let i=0,j=0;
  while(i<n&&j<m){
    if(g[i]===t[j]){ ops.push({t:'same',w:g[i]}); i++; j++; }
    else if(dp[i+1][j]>=dp[i][j+1]){ ops.push({t:'extra',w:g[i]}); i++; }
    else { ops.push({t:'miss',w:t[j]}); j++; }
  }
  while(i<n) ops.push({t:'extra',w:g[i++]});
  while(j<m) ops.push({t:'miss',w:t[j++]});
  return ops;
}
/* 连续的多写／少写合成一段：能说"多写了「two weeks ago」"，而不是三条"多写了一个词" */
function opRuns(ops){
  const runs=[];
  ops.forEach(o=>{ const last=runs[runs.length-1];
    if(last&&last.t===o.t) last.w.push(o.w); else runs.push({t:o.t,w:[o.w]}); });
  return runs;
}
const TIME_WORD=/^(ago|yesterday|tonight|last|tomorrow)$/;
const SHORT_TAIL=/^(have|has|had|do|does|did|is|are|was|were|will|not)$/;
/* 返回 {msg, code}，定位到具体错在哪个词；定位不出来返回 null */
function diffHint(given, ansArr){
  if(!given || given==='(看了答案)') return null;
  if(given==='(未作答)') return {code:'unanswered', msg:'这题空着没填。'};
  const gw=norm(given).split(' ').filter(Boolean);
  if(!gw.length) return null;
  const candidates=ansArr.map(a=>norm(a).split(' ').filter(Boolean)).filter(a=>a.length);
  if(!candidates.length) return null;

  // 选"离你写的最近"的那个标准答案来对照。答案有好几种写法时（Mrs. Jones / her），
  // 原来固定拿第一个或按词数挑，经常挑错，诊断就跟着错。
  let best=null;
  candidates.forEach((cw,k)=>{
    const ops=alignOps(gw,cw), cost=ops.filter(o=>o.t!=='same').length;
    if(!best||cost<best.cost) best={cost:cost, ops:ops, target:cw, disp:ansArr[k]};
  });
  if(!best||!best.cost) return null;

  const target=best.target, tgt=best.disp;            // 提示里回显原样大小写的标准答案
  const runs=opRuns(best.ops);
  // 紧挨着的「多写一段 + 少写一段」= 把某个词写错了，合成"A 应该是 B"，
  // 不然一个拼写错（Joens/Jones）会被拆成"多写了 X、少了 Y"两句，读着莫名其妙
  const subs=[], extras=[], misses=[];
  for(let k=0;k<runs.length;k++){
    const a=runs[k], b=runs[k+1];
    if(a.t==='same') continue;
    if(b && ((a.t==='extra'&&b.t==='miss')||(a.t==='miss'&&b.t==='extra'))){
      const e=(a.t==='extra'?a:b), m=(a.t==='miss'?a:b);
      subs.push({e:e.w, m:m.w}); k++; continue;
    }
    (a.t==='extra'?extras:misses).push(a.w);
  }
  const flat=arr=>[].concat.apply([],arr);
  const extraW=flat(extras), missW=flat(misses);
  const phrase=a=>'「'+a.join(' ')+'」';

  // ① 只换错了一个词：原来那套按词定位的规则最准，保留
  if(subs.length===1 && !extraW.length && !missW.length
     && subs[0].e.length===1 && subs[0].m.length===1){
    const g1=subs[0].e[0], t1=subs[0].m[0];
    const head='你写的是「'+g1+'」，这里应该是「'+t1+'」';
    const sw=swapRule(g1,t1);   if(sw) return {code:sw.code, msg:head+'——'+sw.msg};
    const vf=verbFormRule(g1,t1); if(vf) return {code:vf.code, msg:head+'——'+vf.msg};
    return {code:'word-wrong', msg:head+'。'};
  }

  // ② 只是多写了东西
  if(extraW.length && !missW.length && !subs.length){
    // 简答（Yes, he has. / No, I won't.）：回到助动词就该停
    if(target.length<=4 && SHORT_TAIL.test(target[target.length-1]))
      return {code:'short-answer', msg:'简答写到助动词就停：'+tgt+'。后面多写的'+phrase(extraW)+'不要——动词和时间都不用再重复一遍。'};
    // 完成时的句子里塞了具体的过去时间
    if(extraW.some(w=>TIME_WORD.test(w)) && (target.indexOf('have')>=0||target.indexOf('has')>=0))
      return {code:'time-in-perfect', msg:'多写了'+phrase(extraW)+'——现在完成时只说"做了没"，不能带具体的过去时间。'
        + (target.indexOf('yet')>=0?'问句句尾用 yet 就够了：':'正确：')+tgt+'。具体时间留到后面用一般过去时的那一句。'};
    if(extraW.length===1 && (extraW[0]==='have'||extraW[0]==='has')){
      if(target.indexOf('did')>=0)
        return {code:'tense-aux', msg:'多写了 '+extraW[0]+'——did 和 '+extraW[0]+' 不能同时出现：有了 did（一般过去时），后面直接跟动词原形，'+tgt+'。'};
      return {code:'tense-aux', msg:'多写了 '+extraW[0]+'——这句有明确的过去时间点（yesterday / last week / … ago 这类），只能用一般过去时 '+tgt+'，不能用现在完成时。'};
    }
    return {code:'word-wrong', msg:'多写了'+phrase(extraW)+'，去掉就对了：'+tgt+'。'};
  }

  // ③ 只是漏了东西
  if(missW.length && !extraW.length && !subs.length){
    if(missW.length===1){
      const w=missW[0];
      if(w==='not') return {code:'missing-not', msg:'少了 not——否定句要在 have / has 后面加 not。'};
      if(w==='have'||w==='has') return {code:'tense-aux', msg:'少了助动词 '+w+'——现在完成时是 '+w+' + 过去分词，光写动词形式不够。'};
      if(w==='yet') return {code:'missing-word', msg:'少了句尾的 yet——问"做了没"的完成时问句要用 yet 收尾。'};
      return {code:'missing-word', msg:'少了一个词「'+w+'」。'};
    }
    return {code:'missing-word', msg:'少了'+phrase(missW)+'：'+tgt+'。'};
  }

  // ④ 又错又多又少：逐条说清楚，别只报第一个不一样的词
  const bits=[];
  subs.forEach(x=>bits.push(phrase(x.e)+'应该是'+phrase(x.m)));
  if(extraW.length) bits.push('多写了'+phrase(extraW));
  if(missW.length) bits.push('少了'+phrase(missW));
  return {code: subs.length?'word-wrong':'word-wrong', msg: bits.join('；')+'——照着这句改：'+tgt+'。'};
}
/* 例句：这种"一题要写好几行"的题，光看题干猜不出每行该长什么样。
   所以在输入框上面先摆一组写好的示范（换了个动词，不会直接泄露本题答案），
   批改时哪一行写错，就把那一行的例句再贴一次给你对照。 */
/* 同一组例句在一页里只摆一次：今日作业里连着好几道同一练习的四句链，
   每题都重复贴一遍太占地方。render() 每次重画页面时清空这个集合。 */
let DEMO_SEEN=new Set();
function demoKey(b){ return b.stem+'|'+(b.lines||[]).map(l=>l.s).join('|'); }
/* 同一组例句的题排到一起（都挨着这组第一次出现的那题），配合 DEMO_SEEN 就是
   "一组同样的题 → 一份例句在最上面"。其它题的相对顺序不动。 */
function groupByDemo(list, getRec){
  getRec=getRec||(x=>x);
  const keyOf=x=>{ const r=getRec(x); const dm=(r&&r.ex&&r.ex.type==='multi')?pickDemo(r.ex,r.item):null; return dm?demoKey(dm):null; };
  const out=[], pos={};
  list.forEach(x=>{
    const k=keyOf(x);
    if(k===null){ out.push(x); return; }
    if(pos[k]===undefined){ pos[k]=out.length; out.push(x); return; }
    let i=pos[k]+1;
    while(i<out.length && keyOf(out[i])===k) i++;
    out.splice(i,0,x);
    Object.keys(pos).forEach(kk=>{ if(pos[kk]>=i) pos[kk]++; });
  });
  return out;
}
function pickDemo(ex,it){
  const blocks=(ex&&ex.demo)||null;
  if(!blocks||!blocks.length) return null;
  if(blocks.length===1) return blocks[0];
  const first=s2=>norm(s2||'').split(' ')[0];
  const p0=(it.parts||[])[0];
  const mine=first(p0&&p0.ans&&p0.ans[0]);
  return blocks.find(b=>first(b.lines[0].s)===mine)||blocks[0];
}
function esc(s2){ return String(s2).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function demoHTML(b){
  return '<div class="demo"><div class="demo-h">例句 · 照这个样子写　<span>'+esc(b.stem)+'</span></div>'
    + b.lines.map(l=>'<div class="demo-r"><span class="mlab">'+esc(l.label)+'</span><code>'+esc(l.s)+'</code>'
        + (l.note?'<i>'+esc(l.note)+'</i>':'') + '</div>').join('')
    + '</div>';
}
function egLine(ex,it,i){
  const b=pickDemo(ex,it), l=b&&b.lines&&b.lines[i];
  return l ? '<div class="eg">例句：<code>'+esc(l.s)+'</code>'+(l.note?'　'+esc(l.note):'')+'</div>' : '';
}
function feedbackHTML(ok, given, it, ex){
  // multi 题：逐行对照，指明哪一行错、错在哪个词
  if(it.parts){
    let g=[]; try{ g=JSON.parse(given); }catch(e){}
    let h=(ok?'✓ 每行都对':'✗ 有行写错了');
    it.parts.forEach((pt,i)=>{
      const mine=(g[i]||'').trim();
      const right=gradeAnswer({ans:pt.ans}, mine);
      h+='<div class="exp"><b>'+pt.label+'</b>　'
        + (right ? '<span style="color:var(--ok)">✓ '+mine+'</span>'
                 : '<span style="color:var(--bad)">✗ 你写：'+(mine||'（空着）')+'</span>'
                   + '<br>正确：<span class="ans">'+endPunct(pt.ans[0], pt.label)+'</span>'
                   + (function(){ const d=diffHint(mine, pt.ans); return (d&&d.msg)?'<br>'+d.msg:''; })()
                   + egLine(ex, it, i))
        + '</div>';
    });
    if(it.exp) h+='<div class="exp"><b>为什么：</b>'+it.exp+'</div>';
    return h;
  }
  const ansArr=ansList(it);
  if(ok) return '✓ 对了'+(it.exp?'<div class="exp">'+it.exp+'</div>':'');
  const diff=diffHint(given, ansArr);
  return '✗ 错了 —— 正确答案：<span class="ans">'+ansArr[0]+'</span>'
    + (ansArr.length>1?'<div class="exp" style="border:none;padding:0;margin-top:3px">也可以写：'+ansArr.slice(1).join(' / ')+'</div>':'')
    + (diff?'<div class="exp"><b>哪里错了：</b>'+diff.msg+'</div>':'')
    + '<div class="exp"><b>为什么：</b>'+it.exp+'</div>';
}

/* 这道题考的是什么语法点（用来做知识点维度的统计） */
function tagOf(rec){
  const it=rec.item, task=it.task||'';
  if(it.tag) return it.tag;
  if(/疑问/.test(task)) return '疑问句语序';
  if(/否定/.test(task)) return '否定句构成';
  if(/^加 /.test(task)) return 'just / already / yet 的位置';
  if(rec.unit.id==='u1') return 'have / has + 过去分词';
  if(rec.unit.id==='u2') return 'just / already / yet / ever / never';
  if(rec.unit.id==='u3') return 'been to / gone to';
  if(rec.unit.id==='u4') return '完成时 vs 一般过去时';
  return '其它';
}
function todayStr(d){ const t=d?new Date(d):new Date();
  return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); }

/* ==========================================================================
 *      每日作业：一天一课的体量（原书 Written exercises 是 16–19 题）
 * 不是"顺着往下做"，而是按你的进度和错题现配：
 *   错题回炉（按间隔到期的）→ 当前课次的新语法点 → 更早课次没做过的 → 薄弱点重练
 * 只出你已经学过的课次的题，不提前泄露没学的语法。
 * ========================================================================== */
const DAILY_N = 16;                       // 一天的题量，对齐原书一课的练习量
const REV_STEPS = [1,3,7,21,60];          // 错题重做间隔（天），答对一次往后推一格

/* 这道题属于哪一课 —— 依据原书逐课核对：
   83–84 引入构成 / already·just；85–86 never·ever + been to + 时态对比；
   87–88 yet；89–90 for·since。been/gone 的对比原书没教，算课外（null）。 */
/* 一个语法点属于"引入它的那一课"（奇数课＝课文课），不是后面那节练习课。
   原来按练习课标（yet→88），结果学到 87 课的人练不到 87 课刚教的 yet —— 实测踩到。 */
function lessonOf(rec){
  const u=rec.unit.id, txt=(rec.item.stem+' '+(rec.item.task||'')+' '+ansList(rec.item).join(' ')).toLowerCase();
  if(u==='u1') return 83;                 // L83 课文里就是 I've already packed…
  if(u==='u2'){
    if(/\byet\b/.test(txt)) return 87;    // yet 出自 L87「车修好了吗」
    if(/\bnever\b|\bever\b/.test(txt)) return 85;   // ever/never 出自 L85
    return 83;                            // already / just 出自 L83
  }
  if(u==='u3') return null;               // been/gone 对比：原书没教，课外
  if(u==='u4') return 85;                 // 完成时 vs 过去时从 L85 课文开始对照，L86 专门练
  if(u==='u5') return 89;                 // for / since 出自 L89
  if(u==='u12') return 89;                // 剑桥两个用法：要先会 for / since，89 课之后练
  if(u==='u6') return 89;                 // 课本原型题：89 课之后再来检验
  if(u==='u7') return 91;                 // will 出自 L91–92
  if(u==='u8') return 93;                 // won't / 替换回答出自 L93–94
  if(u==='u9') return 95;                 // had better / in…time 出自 L95–96
  if(u==='u10') return 97;                // 物主代词 / belong to 出自 L97–98
  if(u==='u11') return 99;                // that 从句出自 L99–100
  return null;
}
function lessonLabel(L){ return L?('L'+L+'–'+(L+1)):'课外补充'; }

function curLesson(){
  const v=parseInt(localStorage.getItem('nce1-pp-lesson')||'86',10);
  return isNaN(v)?86:v;
}
function setCurLesson(v){ try{localStorage.setItem('nce1-pp-lesson',String(v))}catch(e){} }

/* 错题到期了没：答错后隔 1 天该重做，答对一次往后推一格（3、7、21、60 天），
   五格全答对就毕业、不再出现。一开始就答对、从没错过的题不进这条曲线。
   原来 s.ok 一为真就直接 return null —— 错题只要重做对一次就永远消失，3/7/21/60 那几格其实从没跑过。 */
function inCurve(s){ return !!s && (s.ok===false || ((s.wrongN||0)>0 && (s.rev||0)<REV_STEPS.length)); }
function dueDays(rec){
  const s=S[rec.key]; if(!inCurve(s)) return null;
  const step=REV_STEPS[Math.min(s.rev||0, REV_STEPS.length-1)];
  const days=s.at?(Date.now()-s.at)/86400000:999;
  return days>=step ? days : null;
}

function buildDaily(n){
  n=n||DAILY_N;
  const L=curLesson();
  const learned=ALL.filter(r=>{ const l=lessonOf(r); return l!==null && l<=L; });
  const extra  =ALL.filter(r=>lessonOf(r)===null);   // 课外补充，只在题不够时补进来

  const picked=[], seen={};
  const take=(list,k,why)=>{
    for(const r of list){
      if(picked.length>=n||k<=0) break;
      if(seen[r.key]) continue;
      seen[r.key]=1; picked.push({rec:r, why:why}); k--;
    }
  };

  // 1) 错题回炉：到期最久的排前面
  const due=learned.filter(r=>dueDays(r)!==null).sort((a,b)=>dueDays(b)-dueDays(a));
  take(due, Math.min(6, due.length), '错题回炉');

  // 2) 当前课次的新内容（没做过的优先）
  const fresh=learned.filter(r=>lessonOf(r)===L && !S[r.key]);
  take(fresh, 8, '本课重点');

  // 3) 更早课次里还没做过的
  const older=learned.filter(r=>!S[r.key]).sort((a,b)=>lessonOf(b)-lessonOf(a));
  take(older, n, '往期巩固');

  // 4) 都做过了 → 从最弱的语法点里挑做对过的重练。只当垫底：最多 4 题，近 7 天做过的不拿，
  //    还在回炉曲线里、没到期的也不提前拿（错题按 1/3/7/21/60 回来，不是天天 16 题刷同一批旧题）
  if(picked.length<n){
    const st=statsData();
    const weakTags=st.byTag.map(t=>t.name);
    const cool=Date.now()-7*86400000;
    const again=learned.filter(r=>{ const x=S[r.key]; return x && x.ok && (x.at||0)<cool && !inCurve(x); })
      .sort((a,b)=>weakTags.indexOf(S[a.key].tag||tagOf(a))-weakTags.indexOf(S[b.key].tag||tagOf(b)));
    take(again, Math.min(4, n-picked.length), '薄弱点重练');
  }
  // 5) 还不够就动用课外补充
  if(picked.length<n) take(extra.filter(r=>!S[r.key]), n, '课外补充');

  return groupByDemo(picked, x=>x.rec);
}

/* 今天该练哪些单词题：本课没做过的优先，其次是到期该回炉的 */
function buildDailyWords(n){
  n=n||WORD_GOAL;
  const L=curLesson(), all=allWordItems(L), out=[], seen={};

  // 「先认后拼」：认读题没答对过之前，不出这个词的拼写题
  const recogOK={};
  all.forEach(x=>{ if(x.stage==='recog' && S[x.key] && S[x.key].ok){
    recogOK[x.key.replace(/\.recog$/,'')]=1; } });
  const usable=all.filter(x=>{
    if(x.stage!=='spell') return true;
    return !!recogOK[x.key.replace(/\.spell$/,'')];   // 认对过才升级到拼写
  });

  const dueW=usable.filter(x=>{ const st=S[x.key]; if(!inCurve(st)) return false;
    const step=REV_STEPS[Math.min(st.rev||0, REV_STEPS.length-1)];
    return ((Date.now()-(st.at||0))/86400000) >= step; });
  const fresh=usable.filter(x=>!S[x.key] && x.les===storyLessonFor(L));
  const older=usable.filter(x=>!S[x.key]);
  [[dueW,'单词回炉'],[fresh,'本课生词'],[older,'词表补漏']].forEach(pair=>{
    pair[0].forEach(x=>{ if(out.length<n && !seen[x.key]){ seen[x.key]=1; out.push({rec:x, why:pair[1]}); } });
  });
  return out;
}

const DONE_KEY='nce1-pp-days';
function loadDays(){ try{ return JSON.parse(localStorage.getItem(DONE_KEY)||'{}'); }catch(e){ return {}; } }
function markDayDone(n,ok){
  const d=loadDays(); const t=todayStr();
  d[t]=d[t]||{n:0,ok:0}; d[t].n+=n; d[t].ok+=ok;
  try{localStorage.setItem(DONE_KEY,JSON.stringify(d))}catch(e){}
}

const tabs=document.getElementById('tabs');

function wrongList(){ return ALL.filter(r=>S[r.key] && S[r.key].ok===false); }

/* 一道题的卡片。注意：这里**不**当场批改——只负责收集你的作答，
   等你点「提交本单元」时再统一判分（apply 由提交按钮调用）。 */
function itemCard(rec,idx,opts){
  const it=rec.item;
  // fresh=true：重做／测评时渲染成空白可答，但**绝不删除存档记录**
  // （早先的写法是先 delete S[key] 再渲染，用户中途放弃就把练习记录永久弄丢了）
  const st = (opts && opts.fresh) ? null : S[rec.key];
  const q=document.createElement('div');
  q.className='q'+(st?(st.ok?' done-ok':' done-bad'):'');
  const qb=document.createElement('div');
  qb.className='qbody';

  if(rec.ex.type==='rw'||it.task){
    qb.insertAdjacentHTML('beforeend','<div class="task">'+(it.task||'改写')+'</div>');
  }

  // stem
  const stem=document.createElement('div'); stem.className='stem';
  let blankInput=null;
  if(rec.ex.type==='fill'){
    const parts=it.stem.split('___');
    stem.append(document.createTextNode(parts[0]));
    const wrap=document.createElement('span'); wrap.className='blank-i';
    blankInput=document.createElement('input'); blankInput.type='text'; blankInput.placeholder='……';
    wrap.appendChild(blankInput); stem.appendChild(wrap);
    stem.append(document.createTextNode(parts[1]||''));
    if(it.hint) stem.insertAdjacentHTML('beforeend',' <span class="chip">'+it.hint+'</span>');
  } else {
    stem.innerHTML=it.stem.replace('___','<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>');
    if(it.hint) stem.insertAdjacentHTML('beforeend',' <span class="chip">'+it.hint+'</span>');
  }
  qb.appendChild(stem);
  if(it.zh) qb.insertAdjacentHTML('beforeend','<div class="zh">'+it.zh+'</div>');

  const fb=document.createElement('div'); fb.className='fb';
  let getAnswer=()=>'';
  let box=null, textInput=null, multiInputs=null;

  if(rec.ex.type==='mc'){
    box=document.createElement('div'); box.className='opts';
    it.opts.forEach(o=>{
      const b=document.createElement('button'); b.type='button'; b.textContent=o;
      if(st){
        b.disabled=true;
        if(norm(o)===norm(st.given)) b.className=st.ok?'pick-ok':'pick-bad';
        else if(norm(o)===norm(it.ans)) b.className='reveal';
      } else {
        b.addEventListener('click',()=>{
          [...box.children].forEach(c=>c.classList.remove('picked'));
          b.classList.add('picked');
        });
      }
      box.appendChild(b);
    });
    qb.appendChild(box);
    getAnswer=()=>{ const p=box.querySelector('button.picked'); return p?p.textContent:''; };
  } else if(rec.ex.type==='multi'){
    // 原书 L88 / L90 那种"一题写两三行"的格式（QUESTION + NEGATIVE、四句链）
    const dm=pickDemo(rec.ex,it);
    if(dm && !DEMO_SEEN.has(demoKey(dm))){
      DEMO_SEEN.add(demoKey(dm));
      qb.insertAdjacentHTML('beforeend', demoHTML(dm));
    }
    const wrap=document.createElement('div'); wrap.className='multiwrap';
    multiInputs=[];
    let saved=[];
    if(st){ try{ saved=JSON.parse(st.given); }catch(e){ saved=[]; } }
    // keepRight：重写错题时，上次已经写对的行直接带过来锁住，只重写写错的那几行
    // （用户反馈：四句链错一行要把四句全抄一遍，不想全写）。上次整题全对（隔天回炉）仍整题重写。
    let keep=null;
    if(!st && opts && opts.keepRight){
      const prev=S[rec.key];
      if(prev && prev.ok===false){
        let pg=[]; try{ pg=JSON.parse(prev.given); }catch(e){ pg=[]; }
        if(Array.isArray(pg) && pg.length){
          keep=(it.parts||[]).map((pt,pi)=>gradeAnswer({ans:pt.ans}, pg[pi]||'') ? String(pg[pi]).trim() : null);
          if(!keep.some(v=>v===null)) keep=null;   // 兜底：没有错行就整题重写
        }
      }
    }
    (it.parts||[]).forEach((pt,pi)=>{
      const row=document.createElement('div'); row.className='mrow';
      const lab=document.createElement('span'); lab.className='mlab'; lab.textContent=pt.label;
      const inp=document.createElement('input'); inp.type='text';
      inp.placeholder=pt.ph||'写完整句';
      if(st){
        inp.value=saved[pi]||''; inp.disabled=true;
        inp.classList.add(gradeAnswer({ans:pt.ans}, saved[pi]||'')?'is-correct':'is-wrong');
      } else if(keep && keep[pi]!=null){
        inp.value=keep[pi]; inp.disabled=true; inp.classList.add('is-correct');
        inp.title='上次已写对，这行不用重写';
      }
      row.append(lab,inp);
      if(!st && keep && keep[pi]!=null){
        const k=document.createElement('span'); k.className='mkeep'; k.textContent='上次已对 ✓'; row.appendChild(k);
      }
      wrap.appendChild(row); multiInputs.push(inp);
      inp.addEventListener('keydown',e=>{
        if(e.key==='Enter'){ e.preventDefault();
          const nx=multiInputs.slice(pi+1).find(x=>!x.disabled); if(nx) nx.focus(); else focusNext(idx); }
      });
    });
    qb.appendChild(wrap);
    getAnswer=()=>{
      const vals=multiInputs.map(x=>x.value.trim());
      // 只看还能填的行有没有写（带过来锁住的行不算"已填"）
      const live=multiInputs.some(x=>!x.disabled) ? multiInputs.filter(x=>!x.disabled) : multiInputs;
      return live.some(x=>x.value.trim()) ? JSON.stringify(vals) : '';
    };
  } else {
    if(rec.ex.type==='rw'){
      textInput=document.createElement('input'); textInput.type='text';
      textInput.placeholder='把整句写在这里'; textInput.className='fullin';
      qb.appendChild(textInput);
    } else {
      textInput=blankInput;
    }
    if(st){ textInput.value=st.given; textInput.disabled=true; }
    getAnswer=()=>textInput.value.trim();
    // 回车 = 跳到下一题的输入框（不再是当场判分）
    textInput.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); focusNext(idx); } });
  }

  if(st){
    fb.className='fb show '+(st.ok?'good':'bad');
    fb.innerHTML=feedbackHTML(st.ok, st.given, it, rec.ex);
  }
  qb.appendChild(fb);

  const top=document.createElement('div'); top.className='qtop';
  const n=document.createElement('div'); n.className='num'; n.textContent=rec.no;
  top.append(n,qb); q.appendChild(top);
  q.dataset.idx=idx;

  return {
    el:q, rec:rec, done:!!st, getAnswer:getAnswer,
    apply:function(ok, given){
      const prev=S[rec.key]||{};
      const rd={ok:ok, given:given, at:Date.now(), tag:tagOf(rec)};
      // 答对一次就把下次回炉时间往后推一格；答错归零，明天再来
      rd.rev = ok ? (prev.rev||0)+1 : 0;
      rd.wrongN = (prev.wrongN||0) + (ok?0:1);   // 错过几次：>0 才进 1/3/7/21/60 回炉曲线
      if(!ok){ const d=diffHint(given, ansList(it)); rd.err=d?d.code:'other'; }
      S[rec.key]=rd;
      q.className='q '+(ok?'done-ok':'done-bad');
      fb.className='fb show '+(ok?'good':'bad');
      fb.innerHTML=feedbackHTML(ok, given, it, rec.ex);
      if(box){
        [...box.children].forEach(c=>{
          c.disabled=true; c.classList.remove('picked');
          if(norm(c.textContent)===norm(given)) c.className=ok?'pick-ok':'pick-bad';
          else if(!ok && norm(c.textContent)===norm(it.ans)) c.className='reveal';
        });
      } else if(multiInputs){
        let g=[]; try{ g=JSON.parse(given); }catch(e){}
        multiInputs.forEach((inp,pi)=>{
          inp.disabled=true;
          const right=gradeAnswer({ans:((it.parts[pi]||{}).ans)||[]}, g[pi]||'');
          inp.classList.add(right?'is-correct':'is-wrong');
        });
      } else if(textInput){
        textInput.disabled=true;
        textInput.classList.add(ok?'is-correct':'is-wrong');
      }
    }
  };
}

function focusNext(idx){
  const next=main.querySelector('.q[data-idx="'+(idx+1)+'"] input:not([disabled])');
  if(next) next.focus();
}

/* 一整批题目共用的提交栏：填完整个单元，一次性交卷批改 */
function attachSubmitBar(container, cards, label, onDone){
  const pending=cards.filter(c=>!c.done);
  if(!pending.length) return;            // 这批已经交过了，不用再放提交栏

  const bar=document.createElement('div'); bar.className='submit-row';
  const counter=document.createElement('span'); counter.className='submit-counter';
  const btn=document.createElement('button'); btn.className='btn'; btn.type='button'; btn.textContent=label;
  bar.append(counter, btn);
  container.appendChild(bar);

  function refresh(){
    const filled=pending.filter(c=>c.getAnswer()).length;
    counter.textContent='已填 '+filled+' / '+pending.length;
  }
  container.addEventListener('input', refresh);
  container.addEventListener('click', refresh);
  refresh();

  btn.onclick=function(){
    const blank=pending.filter(c=>!c.getAnswer()).length;
    if(blank && !confirm('还有 '+blank+' 题没填，直接交卷吗？空着的按答错处理。')) return;
    let ok=0;
    pending.forEach(c=>{
      const given=c.getAnswer();
      const right=given?gradeAnswer(c.rec.item,given):false;
      if(right) ok++;
      c.apply(right, given||'(未作答)');
    });
    save();
    bar.remove();
    if(onDone){ onDone(ok, pending.length, container); }
    else {
      const done=document.createElement('div');
      done.className='submit-row';
      done.innerHTML='<span class="submit-counter">已交卷 · 对 '+ok+' / '+pending.length
        +'（错的往上翻，每题都有批改）</span>';
      container.appendChild(done);
    }
    updateBars();
  };
}

  Object.keys(MUST).forEach(u=>MUST[u].forEach((x,i)=>{ all++; if(m[u+'.'+i]) ok++; }));
  return {all:all, ok:ok};

function mustPanelHTML(uid){
  const list=MUST[uid]||[]; if(!list.length) return '';
  const m=loadMemo();
  let h='<div class="mustbox"><div class="musthead"><span class="mtag">该背</span>'
   + '必背句型 '+list.length+' 句<span class="musthint">背到不用想就能说出来；下面的公式和拆解属于"该理解"，不用背字面</span></div>';
  list.forEach((x,i)=>{
    const k=uid+'.'+i, done=!!m[k];
    h+='<div class="mustrow'+(done?' done':'')+'" data-k="'+k+'">'
     + '<button class="mchk" type="button" title="背熟了就打勾">'+(done?'✓':'')+'</button>'
     + '<div class="mmain"><div class="men">'+x.en+'</div>'
     + '<div class="mzh">'+x.zh+'　<span class="mwhy">'+x.why+'</span></div></div>'
     + '<button class="splay mspk" type="button" data-en="'+x.en.replace(/"/g,'&quot;')+'" title="读一遍">▶</button>'
     + '</div>';
  });
  h+='</div>';
  return h;
}
function bindMustPanel(){
  main.querySelectorAll('.mustrow').forEach(row=>{
    const chk=row.querySelector('.mchk');
    chk.onclick=()=>{
      const on=toggleMemo(row.dataset.k);
      row.classList.toggle('done',on);

      updateBars();
    };

const WORD_GOAL=10;            // 每天单词题量
function wordLessons(){ return Object.keys(WORDS).map(Number).sort((a,b)=>a-b); }
function wordsUpTo(L){
  const out=[];
  wordLessons().filter(n=>n<=L).forEach(n=>WORDS[n].forEach((w,i)=>out.push({les:n,idx:i,w:w})));
  return out;
}

/* 把一个单词变成若干道题，直接复用现有的做题／批改／回炉机制 */
/* 干扰项：从同一课（不够就补邻课）里挑别的词的释义 */
function distractors(les, idx, n){
  const pool=[];
  // 干扰项只从「已学课次」里挑 —— 顺手当复习，也不牵扯没学的课
  const upTo=Math.max(les, curLesson());
  wordLessons().filter(l=>l<=upTo).forEach(l=>WORDS[l].forEach((w,i)=>{ if(!(l===les&&i===idx)) pool.push(w.cn); }));
  if(pool.length<n){ wordLessons().forEach(l=>WORDS[l].forEach((w,i)=>{ if(!(l===les&&i===idx)) pool.push(w.cn); })); }
  const out=[], used={};
  while(out.length<n && pool.length){
    const j=Math.floor(((les*31+idx*7+out.length*13)%pool.length));
    const v=pool[j];
    if(!used[v]){ used[v]=1; out.push(v); }
    pool.splice(j,1);
  }
  return out;
}

function wordItems(L){
  const out=[];
  wordsUpTo(L).forEach(x=>{
    const w=x.w, base='w.'+x.les+'.'+x.idx;
    // ① 认词：英 → 中（第一次见这个词先认，别一上来就让人拼）
    const opts=distractors(x.les,x.idx,3).concat([w.cn]).sort();
    out.push({key:base+'.recog', kind:'word', les:x.les, stage:'recog',
      unit:{id:'word', tab:'单词', title:'单词'}, ex:{type:'mc'},
      item:{stem:'<b>'+w.w+'</b>'+(w.ph?' <span style="font-family:var(--font-mono);font-size:12px;color:var(--ink3)">'+w.ph+'</span>':'')+' 是什么意思？',
            opts:opts, ans:w.cn, zh:'',
            exp:'『'+w.w+'』'+w.ph+' '+w.pos+' '+w.cn+'　例：'+w.eg+'（'+w.egzh+'）',
            tag:'单词认读 · L'+x.les}});
    // ② 拼写：看中文写单词（认对过才升级到这一级）
    out.push({key:base+'.spell', kind:'word', les:x.les, stage:'spell',
      unit:{id:'word', tab:'单词', title:'单词'}, ex:{type:'fill'},
      item:{stem:'___', hint:w.cn+(w.pos?('　'+w.pos):''), ans:[w.w], zh:w.cn,
            exp:'『'+w.w+'』'+w.ph+' '+w.pos+' '+w.cn+'　例：'+w.eg,
            tag:'单词拼写 · L'+x.les}});
    // ② 三态：写过去分词（不规则动词专项）
    if(w.three){
      out.push({key:base+'.pp', kind:'word', les:x.les, stage:'pp',
        unit:{id:'word', tab:'单词', title:'单词'}, ex:{type:'fill'},
        item:{stem:w.three[0]+' 的过去分词是 ___', hint:'', ans:[w.three[2]], zh:w.cn,
              exp:w.three.join(' – ')+'（原形 – 过去式 – 过去分词）。现在完成时用的是第三个。',
              tag:'不规则动词三态'}});
    }
  });
  return out;
}
function irregItems(){
  return IRREG_DRILL.map((t,i)=>({
    key:'w.irreg.'+i, kind:'word', les:88, stage:'pp',
    unit:{id:'word', tab:'单词', title:'单词'}, ex:{type:'fill'},
    item:{stem:t[0]+' 的过去分词是 ___', hint:'', ans:[t[2]], zh:'',
          exp:t.join(' – ')+'（原形 – 过去式 – 过去分词）。'
             +(t[1]===t[2]?'过去式和过去分词同形。':'注意过去式和过去分词不一样，别写混。'),
          tag:'不规则动词三态'}
  }));
}
function allWordItems(L){ return wordItems(L).concat(irregItems()); }

function wordStats(){
  const L=curLesson(), all=wordsUpTo(L), m=loadWMemo();
  const known=all.filter(x=>m['w.'+x.les+'.'+x.idx]).length;
  const items=allWordItems(L);
  const done=items.filter(x=>S[x.key]).length;
  const ok=items.filter(x=>S[x.key]&&S[x.key].ok).length;
  return {total:all.length, known:known, itemsTotal:items.length, done:done, ok:ok};
}

function loadTexts(){
  let mine={};
  try{ mine=JSON.parse(localStorage.getItem(TEXT_KEY)||'{}'); }catch(e){}
  const out={};
  Object.keys(BUILTIN_TEXTS).forEach(k=>{ out[k]=BUILTIN_TEXTS[k]; });
  Object.keys(mine).forEach(k=>{ out[k]=mine[k]; });   // 你换过的原文覆盖内置仿写
  return out;
}
function saveTexts(t){ try{localStorage.setItem(TEXT_KEY,JSON.stringify(t))}catch(e){} }
function loadReads(){ try{ return JSON.parse(localStorage.getItem(READ_KEY)||'{}'); }catch(e){ return {}; } }
function saveReads(r){ try{localStorage.setItem(READ_KEY,JSON.stringify(r))}catch(e){} }

/* 当前该读哪一课：你学到的课次里，最靠后的那个单数课 */
function storyLessonFor(L){
  const ks=Object.keys(STORY_LESSONS).map(Number).filter(n=>n<=L).sort((a,b)=>b-a);
  return ks.length?ks[0]:83;
}
function readsToday(L){
  const r=loadReads(), t=todayStr();
  return (r[t]&&r[t][L])||0;
}
function addRead(L){
  const r=loadReads(), t=todayStr();
  r[t]=r[t]||{}; r[t][L]=(r[t][L]||0)+1; saveReads(r);
}
function splitSentences(t){
  if(!t) return [];
  const hasCJK=/[。！？]/.test(t);
  if(hasCJK){
    // 中文按全角标点切，标点跟着上一句
    return t.replace(/\s+/g,'').split(/(?<=[。！？])/).map(x=>x.trim()).filter(Boolean);
  }
  // ⚠️ 不能见到句点就断句：Mr. / Mrs. / Dr. 这类缩写会把一句话切成两半，
  //    课文显示成半句、必背句下标还会整体错位（实测 L89 的 "Mr. Jones" 踩到）。
  //    做法：先把缩写里的点换成占位符，切完再换回来。
  const ABBR=['Mr','Mrs','Ms','Dr','St','Prof','vs','etc','No','Jr','Sr','a.m','p.m','e.g','i.e'];
  let s=t.replace(/\s+/g,' ').trim();
  ABBR.forEach(a=>{ s=s.split(a+'.').join(a+'\u0001'); });
  return s.split(/(?<=[.!?])\s+/)
    .map(x=>x.split('\u0001').join('.').trim())
    .filter(Boolean);
}

/* 浏览器自带的英语朗读，用来跟读 */
let VOICE=null;
function pickVoice(){
  if(VOICE||!window.speechSynthesis) return VOICE;
  const vs=speechSynthesis.getVoices()||[];
  VOICE = vs.find(v=>/en-GB/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null;
  return VOICE;
}
if(window.speechSynthesis) speechSynthesis.onvoiceschanged=()=>{VOICE=null;pickVoice();};
function speak(text, rate){
  if(!window.speechSynthesis) return false;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  const v=pickVoice(); if(v) u.voice=v;
  u.lang=(v&&v.lang)||'en-GB';
  u.rate=rate||0.9;
  speechSynthesis.speak(u);
  return true;
}

      + '　'+STORY_LESSONS[n]+'</button>';
  });
  h+='</div></div>';

  if(EDIT_TEXT===L){
    h+='<div class="panel"><div class="form">'
     + '<label>英文课文（贴你书上的原文，会覆盖这篇仿写）<textarea id="txEn" rows="7"></textarea></label>'
     + '<label>中文翻译（可选，逐句对照用）<textarea id="txZh" rows="4"></textarea></label>'
     + '<div class="acts"><button class="btn" id="txSave" type="button">保存</button>'
     + '<button class="btn ghost" id="txCancel" type="button">取消</button>'
     + '<button class="btn ghost" id="txReset" type="button">恢复内置仿写</button></div>'
     + '</div></div>';
  } else {
    const sents=splitSentences(cur.en);
    const zhs=cur.zh?splitSentences(cur.zh):[];
    h+='<div class="acts" style="margin:16px 0 4px">'
     + '<button class="btn" id="playAll" type="button">整篇朗读</button>'
     + '<button class="btn ghost" id="playSlow" type="button">慢速朗读</button>'
     + '<button class="btn ghost" id="hideAll" type="button">全部遮住（背诵检测）</button>'
     + '<button class="btn ghost" id="hideZh" type="button">隐藏翻译</button>'
     + '<button class="btn ghost" id="markRead" type="button">跟读完一遍 +1</button>'
     + '<button class="btn ghost" id="txEdit" type="button">换成书上原文</button>'
     + '</div>';
    h+='<div class="panel story">';
    const mustIdx=cur.must||[];
    // 本课生词在课文里标出来：读的时候点一下就看释义，不用跳到单词页
    const vocab=(WORDS[L]||[]).slice().sort((a,b)=>b.w.length-a.w.length);
    const markVocab=(txt)=>{
      let out=txt;
      vocab.forEach(w=>{
        const stem=w.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
        // 连同常见变形一起匹配（packed / repaired / brought…），只标第一次出现
        const forms=[stem];
        if(w.three) forms.push(w.three[1],w.three[2]);
        if(/[a-z]$/.test(w.w)) forms.push(stem+'s', stem+'ed', stem+'d', stem.replace(/e$/,'')+'ing');
        const re=new RegExp('\\b('+forms.filter(Boolean).join('|')+')\\b','i');
        out=out.replace(re, m=>'<span class="vw" data-w="'+w.w+'">'+m+'</span>');
      });
      return out;
    };
    sents.forEach((sn,i)=>{
      const isMust=mustIdx.indexOf(i)>=0;
      h+='<div class="sent'+(isMust?' must':'')+'" data-i="'+i+'">'
       + '<span class="sidx">'+(isMust?'<span class="mtag mini">背</span>':(i+1))+'</span>'
       + '<span class="sen">'+markVocab(sn)+'</span>'
       + (zhs[i]?'<span class="szh">'+zhs[i]+'</span>':'')
       + '<button class="splay" data-s="'+i+'" type="button" title="读这句">▶</button>'
       + '</div>';
    });
    h+='</div>';
    h+='<div class="dayflag">标「<span class="mtag mini">背</span>」的 '+mustIdx.length
     + ' 句是这一课的骨架句，必须背下来；其余句子读顺就行。'
     + '</div><div style="display:none">';
    h+='</div>';
    h+='<div class="dayflag">背诵检测：点「全部遮住」后英文会盖起来（只留首字母和中文提示），你自己说一遍再点句子揭开对照。</div>';
  }
  main.innerHTML=h;

  main.querySelectorAll('.spick').forEach(b=>{
    b.onclick=()=>{ setCurLesson(Math.max(curLesson(), parseInt(b.dataset.l,10))); STORY_VIEW=parseInt(b.dataset.l,10); renderTextAt(STORY_VIEW); };
  });

  const save1=document.getElementById('txSave');
  if(save1){
    document.getElementById('txEn').value=cur.en||'';
    document.getElementById('txZh').value=cur.zh||'';
    save1.onclick=()=>{
      const en=document.getElementById('txEn').value.trim();
      if(!en){ alert('英文课文不能为空'); return; }
      let mine={}; try{ mine=JSON.parse(localStorage.getItem(TEXT_KEY)||'{}'); }catch(e){}
      mine[L]={title:cur.title||'', focus:cur.focus||'', en:en, zh:document.getElementById('txZh').value.trim()};
      saveTexts(mine); EDIT_TEXT=null; renderText();
    };
    document.getElementById('txCancel').onclick=()=>{ EDIT_TEXT=null; renderText(); };
    document.getElementById('txReset').onclick=()=>{
      let mine={}; try{ mine=JSON.parse(localStorage.getItem(TEXT_KEY)||'{}'); }catch(e){}
      delete mine[L]; saveTexts(mine); EDIT_TEXT=null; renderText();
    };
  }
  const ed=document.getElementById('txEdit');
  if(ed) ed.onclick=()=>{ EDIT_TEXT=L; renderText(); };
  const pa=document.getElementById('playAll');
  if(pa){
    pa.onclick=()=>{ if(!speak(cur.en,0.92)) alert('这个浏览器不支持朗读'); };
    document.getElementById('playSlow').onclick=()=>{ speak(cur.en,0.65); };
    document.getElementById('markRead').onclick=()=>{ addRead(L); renderText(); updateBars(); };
    document.getElementById('hideAll').onclick=function(){
      const on=main.classList.toggle('recite');
      this.textContent=on?'取消遮住':'全部遮住（背诵检测）';
    };
    const zhBtn=document.getElementById('hideZh');
    if(localStorage.getItem('nce1-pp-hidezh')==='1'){ main.classList.add('hidezh'); zhBtn.textContent='显示翻译'; }
    zhBtn.onclick=function(){
      const on=main.classList.toggle('hidezh');
      this.textContent=on?'显示翻译':'隐藏翻译';
      try{localStorage.setItem('nce1-pp-hidezh',on?'1':'0')}catch(e){}
    };
    main.querySelectorAll('.splay').forEach(b=>{
      b.onclick=(e)=>{ e.stopPropagation(); speak(splitSentences(cur.en)[+b.dataset.s],0.9); };
    });
    main.querySelectorAll('.sent').forEach(el=>{
      el.onclick=()=>{ el.classList.toggle('reveal'); };
    });
    // 点生词看释义（阻止冒泡，免得同时把整句揭开）
    main.querySelectorAll('.vw').forEach(el=>{
      el.onclick=(e)=>{
        e.stopPropagation();
        // ① 再点同一个词就收起来。以前点开了没有任何办法关掉（2026-09-12 用户报的）
        const openedHere = VWPOP && VWPOP.parentNode===el;
        closeVwPop();
        if(openedHere) return;
        const w=(WORDS[L]||[]).find(x=>x.w===el.dataset.w); if(!w) return;
        // ⚠️ 弹卡是 append 进 .vw 里面的，所以不能用 el.textContent 取词
        //    （卡片开着时会把释义也算进去）。只取第一个文本节点＝屏幕上那个词形。
        const form=(el.firstChild&&el.firstChild.nodeType===3?el.firstChild.nodeValue:el.textContent||'').trim();
        const same=form.toLowerCase()===String(w.w).toLowerCase();
        const pop=document.createElement('span');
        pop.className='vwpop';
        // ② 音标是**原形**的音标。点的是 brought，就绝不能把 /brɪŋ/ 摆在 brought 后面
        //    （2026-09-12 用户报的：点 brought 弹出 bring 的发音，会背错音）。
        //    所以标题永远用被点的那个形式，音标和词性挂回「原形」那一行。
        pop.innerHTML='<button class="vwx" title="关闭">×</button>'
          + '<b>'+form+'</b>'
          + (same ? ' '+(w.ph||'')+' '+(w.pos||'')+'　'+w.cn
                  : '<span class="vwlem">原形 '+w.w+' '+(w.ph||'')+' '+(w.pos||'')+'　'+w.cn+'</span>')
          + (w.three?'<br>三态 '+w.three.map(f=>
                String(f).toLowerCase()===form.toLowerCase()?'<u>'+f+'</u>':f).join(' – ')
              +'（完成时用 '+w.three[2]+'）':'');
        el.appendChild(pop);
        VWPOP=pop;
        pop.querySelector('.vwx').onclick=(ev)=>{ ev.stopPropagation(); closeVwPop(); };
        speak(form, 0.8);                            // ③ 读屏幕上那个形式，不是原形
      };
    });
  }
}
/* 生词卡的开关：以前只有「打开」没有「关闭」，点开就赖在那儿（2026-09-12 用户报的）。
   这里统一管：再点一次收起 / 点别处收起 / Esc 收起 / 卡片上有个 × 。
   监听器只装一次，不能放进 render 里，否则每渲染一次叠一层。 */
let VWPOP=null;
function closeVwPop(){ if(VWPOP){ VWPOP.remove(); VWPOP=null; } }
document.addEventListener('mousedown', e=>{
  if(!VWPOP) return;
  if(VWPOP.contains(e.target)) return;              // 在卡片里点（比如想选中文字）不算
  if(e.target.closest && e.target.closest('.vw')) return;  // 点另一个生词交给它自己的 onclick 处理
  closeVwPop();
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeVwPop(); });

const EXAM_KEY='nce1-pp-exams';
function loadExams(){ try{ return JSON.parse(localStorage.getItem(EXAM_KEY)||'[]'); }catch(e){ return []; } }
function saveExams(l){ try{localStorage.setItem(EXAM_KEY,JSON.stringify(l))}catch(e){} }

/* 已学到第 L 课时，涉及哪些知识点（用来保证组卷覆盖全面） */
function learnedTags(L){
  const seen={};
  ALL.forEach(r=>{ const l=lessonOf(r); if(l!==null&&l<=L){ seen[tagOf(r)]=1; } });
  return Object.keys(seen);
}
/* 本地组卷：每个已学知识点均匀抽题，优先没做过和做错过的 */
function buildExamLocal(L, n){
  const tags=learnedTags(L);
  const pool={};
  ALL.forEach(r=>{ const l=lessonOf(r); if(l===null||l>L) return;
    const t=tagOf(r); (pool[t]=pool[t]||[]).push(r); });
  Object.keys(pool).forEach(t=>{
    pool[t].sort((a,b)=>{
      const sa=S[a.key], sb=S[b.key];
      const wa=!sa?0:(sa.ok?2:1), wb=!sb?0:(sb.ok?2:1);   // 没做过 → 做错过 → 做对过
      return wa-wb;
    });
  });
  const out=[]; let i=0;
  while(out.length<n){
    let added=false;
    for(const t of tags){
      if(out.length>=n) break;
      if(pool[t] && pool[t][i]){ out.push(pool[t][i]); added=true; }
    }
    if(!added) break;
    i++;
  }
  return out;
}
